spec: sandbox-provider-spec/0.1
provider: archil
class: default
verified:
  date: 2026-11-27
  sdks: {archil: 0.23.0, httpx: 0.28.1, sandbox-provider-spec: 0.5.162}
resources:
  kernel: dedicated
  # Two GiB of memory per vCPU. The Console presets stop at 8 vCPU; the API takes 1 to 32 vCPU.
  sizes:
  - {cpu: 1, memory_mib: 2048}
  - {cpu: 2, memory_mib: 4096}
  - {cpu: 4, memory_mib: 8192}
  - {cpu: 8, memory_mib: 16384}
  - {cpu: 16, memory_mib: 32768}
  - {cpu: 32, memory_mib: 65536}
  size_is_ceiling: true
  regions: [archil:aws-us-east-1, archil:aws-us-west-2, archil:aws-eu-west-1]
  located_in: unknown
  max_lifetime_seconds: 86400
  paused_retention_seconds: unknown
  max_run_seconds: unknown
  max_process_seconds: unknown
  disk_mib: unknown
  outbound_traffic: unknown
lifetime_timer:
  enforced_by: provider
  counts_paused_time: false
  at_end: [destroyed, paused]
gates:
  custom_images:
  - {source: oci, prepared: false}
  processes:
  - reattach: true
  user_selection:
  - {commands: true, files_write: true, process_start: true}
evidence:
  gates.user_selection.0.commands:
    tests: [coverage.guest_user.selectable]
    report: reports/actions-user-selection-20261126.json
  gates.user_selection.0.files_write:
    tests: [coverage.guest_user.selectable]
    report: reports/actions-user-selection-20261126.json
  gates.user_selection.0.process_start:
    tests: [coverage.guest_user.selectable]
    report: reports/actions-user-selection-20261126.json
  gates.custom_images.0.source:
    tests: [coverage.custom_images.direct.oci]
    report: reports/actions-user-selection-20261126.json
  gates.custom_images.0.prepared:
    tests: [coverage.custom_images.direct.oci]
    report: reports/actions-user-selection-20261126.json
  gates.processes.0.reattach:
    tests: [processes.reattach.true]
    report: reports/actions-user-selection-20261126.json
  resources.kernel:
    source: https://docs.archil.com/compute/sandboxes/introduction
    read: 2026-11-24
    quote: Each sandbox is a dedicated Firecracker microVM with its own Linux kernel.
  resources.sizes:
    source: https://docs.archil.com/compute/sandboxes/introduction
    read: 2026-11-27
    quote: support between 1 and 32 vCPU cores and between 0.25 and 64 GiB of memory.
  resources.regions:
    source: https://docs.archil.com/reference/regions
    read: 2026-11-24
    quote: Persistent sandboxes are available in aws-us-east-1, aws-us-west-2, and aws-eu-west-1.
  resources.max_lifetime_seconds:
    source: https://docs.archil.com/compute/sandboxes/introduction
    read: 2026-11-24
    quote: A session runs for up to 24 hours, then pauses with its processes intact.
  lifetime_timer.enforced_by:
    source: https://docs.archil.com/compute/sandboxes/introduction
    read: 2026-11-24
    quote: A session pauses after at most 24 hours.
  lifetime_timer.counts_paused_time:
    source: https://docs.archil.com/compute/sandboxes/introduction
    read: 2026-11-24
    quote: Stopped and paused sandboxes do not accrue compute charges.
  lifetime_timer.at_end:
    source: https://pypi.org/project/archil/0.23.0/
    read: 2026-11-24
    quote: Both TTLs pause the sandbox ... Create a sandbox with on_timeout="delete" to delete it and its disk.
  resources.size_is_ceiling:
    tests: [coverage.facts.size_is_ceiling.true]
    report: reports/ceiling-2cpu-4gib-20261127.json
