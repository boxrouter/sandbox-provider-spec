spec: sandbox-provider-spec/0.1
provider: sail
class: default
# Every value is `unknown`, absent, a dated quote of Sail's documentation or a committed
# tester report (the `sps-provider-sail` adapter over Sail's HTTP API). The adapter serves
# the baseline surface (create, get, list, destroy, run, files, native processes by reattach
# and cost) and states seven gates in discovery (processes, user selection, pause and resume,
# previews, network lockdown, custom images and snapshots), each proven by a tester run from a clean checkout. Every other gate stays
# unknown until a run report proves it.
verified:
  date: 2026-11-26
  # The adapter calls Sail's Sailbox HTTP API through httpx, not Sail's own SDK; the newest
  # report records the tester stack it ran with.
  sdks: {"httpx": "0.28.1", "sandbox-provider-spec": "0.5.142"}
resources:
  compliance: [soc2]
  kernel: dedicated
  arch: [amd64]
  libc: glibc
  package_manager: apt
  disk_in_memory: false
  # The six sizes the adapter offers (Sail's limits, rounded up to a power of two: 1, 2, 4, 8,
  # 16 and 32 vCPUs with 16, 16, 32, 64, 128 and 256 GiB of memory and 32, 32, 64, 128, 256 and
  # 512 GiB of state disk; 64 vCPUs is in public beta, where Sail asks users to reach out, so it
  # is not offered). A create's request floors pick the smallest listed size that meets them;
  # each value is a limit, not a reservation, and Sail bills the actual usage below it. The
  # guest starts with 16 GiB of memory visible at every size and grows toward the limit as the
  # workload uses it (measured 2026-11-25 on the 8 vCPU / 64 GiB size: MemTotal 16, 24, 38 and
  # 58 GiB while 11, 15, 21 and 40 GiB were held), so `coverage.facts.sizes.delivered`, which
  # reads an idle guest, passes at 16 GiB and differs above it.
  sizes:
  - {cpu: 1, memory_mib: 16384, disk_mib: 32768}
  - {cpu: 2, memory_mib: 16384, disk_mib: 32768}
  - {cpu: 4, memory_mib: 32768, disk_mib: 65536}
  - {cpu: 8, memory_mib: 65536, disk_mib: 131072}
  - {cpu: 16, memory_mib: 131072, disk_mib: 262144}
  - {cpu: 32, memory_mib: 262144, disk_mib: 524288}
  # What a create without resources gets: the smallest offered size (this integration's choice;
  # Sail's own SDK default is 8 vCPUs, 64 GiB of memory and 256 GiB of disk).
  default_size: {cpu: 1, memory_mib: 16384, disk_mib: 32768}
  default_user: root
  default_cwd: /
  root: [by_default]
  gpus: unknown
  regions: unknown
  # The longest `lifetime_seconds` this integration accepts on a create; a longer request is
  # refused, not clamped. Sail accepts up to 4294967295 (or no lifetime at all), but Cloud
  # stores a lifetime in 32-bit signed columns, so the cap is the largest 32-bit value.
  max_lifetime_seconds: 2147483647
  max_run_seconds: unknown
  max_process_seconds: {at_least: 600}
  on_memory_exhausted: unknown
  extendable_lifetime: unknown
  paused_retention_seconds: unknown
lifetime_timer:
  enforced_by: provider
  counts_paused_time: true
  at_end: [destroyed]
# Gates the adapter offers in discovery, each proven by a tester run from a clean checkout
# (reports/tester-default-{pause-resume,user-selection,previews,network-lockdown,custom-images,snapshots}.json).
# Snapshots: a Sail checkpoint of the files (`include_memory` false) that outlives its Sailbox, deletes on
# demand and lasts seven days; a snapshot's labels are kept by the router. `files_and_memory` is not declared:
# a restore continues only detached processes, not this adapter's. `original_after` is not declared (the
# tester's ticker cannot read the short freeze).
# Custom images: Sail builds a registry image (Debian- or Ubuntu-based only) ahead of creation and a
# sandbox starts from it; the labels of a prepared image are kept by the router. `image_config`,
# `image_defaults` and Dockerfile sources are not declared (the tester's Alpine image cannot be built).
# Sail's native listeners are public and revocable; a preview link's lifetime is the requested
# bound the tester observes. Network lockdown: Sail enforces an egress policy per Sailbox
# (`egress_policy`): an allowlist of names (with `*.` wildcards) and addresses, `deny_all` and
# `open`, replaceable on a running Sailbox. A denylist is not declared: Sail blocks a name only
# under an allowlist. Process input and cancel stay unclaimed (no native operation).
gates:
  processes:
  - reattach: true
  snapshots:
  - keeps: files_only
    deletable: true
    retention_seconds: 604800
  custom_images:
  - source: provider_artifact
  - source: oci
    prepared: true
  user_selection:
  - commands: true
    files_write: true
    process_start: true
  pause_resume:
  - keeps: files_and_memory
  previews:
  - access: public
    revocable: true
    any_port: true
    link_lifetime_seconds:
      at_least: 300
    reserved_ports: [22, 10000, 10001, 15001, 15002]
    survives_pause: true
    websocket: true
  network_lockdown:
  - policy: allowlist
    entry_kinds: [names, addresses]
    allow_wildcards: true
    max_allow:
      at_least: 32
  - policy: [allowlist, deny_all, open]
    entry_kinds: [names, addresses]
    allow_wildcards: true
    max_allow:
      at_least: 32
    switchable: true
    changeable: true
evidence:
  gates.processes.0.reattach:
    tests: [processes.reattach.true]
    report: reports/actions-reattach-20261126.json
  resources.sizes:
    source: https://docs.sailresearch.com/sailboxes-pricing.md
    read: 2026-11-24
    quote: >-
      CPU: 1–64 vCPUs per Sailbox. Memory: 16–256 GiB per Sailbox. Disk: 8–1024 GiB per
      Sailbox. Limits round up to the next power of two. Limits cap what a workload can use.
      Creates at 16 vCPU / 128 GiB / 256 GiB and 32 vCPU / 256 GiB / 512 GiB were accepted
      and ran on 2026-11-27 (each reported those limits back and was terminated at once).
  resources.default_size:
    source: https://docs.sailresearch.com/sailboxes-pricing.md
    read: 2026-11-24
    quote: >-
      CPU: 1–64 vCPUs per Sailbox. Memory: 16–256 GiB per Sailbox. Disk: 8–1024 GiB per
      Sailbox.
  resources.compliance:
    source: https://docs.sailresearch.com/security
    read: '2026-11-23'
    quote: "Sail is SOC 2 Type I compliant. You can request the independent auditor report through our Trust Center."
  resources.kernel:
    source: https://docs.sailresearch.com/sailboxes.md
    read: 2026-11-23
    quote: >-
      Every Sailbox is an isolated VM that can have up to 64 vCPUs and terabytes of RAM and
      disk.
  resources.arch:
    tests: [coverage.facts.arch.amd64]
    report: reports/tester-default-coverage.json
  resources.libc:
    tests: [coverage.facts.libc.glibc]
    report: reports/tester-default-coverage.json
  resources.package_manager:
    tests: [coverage.facts.package_manager.apt]
    report: reports/tester-default-coverage.json
  resources.disk_in_memory:
    tests: [coverage.facts.disk_in_memory.false]
    report: reports/tester-default-coverage.json
  resources.default_user:
    tests: [facts.default_user]
    report: reports/tester-default-select.json
  resources.default_cwd:
    tests: [facts.default_cwd]
    report: reports/tester-default-select.json
  resources.root:
    tests: [coverage.facts.root.by_default]
    report: reports/tester-default-coverage.json
  resources.max_lifetime_seconds:
    source: https://docs.sailresearch.com/sailbox-openapi.json
    read: 2026-11-23
    quote: >-
      "Terminate this Sailbox after this many wall-clock seconds from creation, including
      time spent waiting for capacity, sleeping, or paused. ... Omit or pass null for
      unlimited lifetime. The deadline cannot be extended. Expiration is checked
      periodically" — the API accepts 1 to 4294967295 (a create with 4294967285, the maximum
      less this integration's 10 s margin, was accepted on 2026-11-27); this integration
      accepts up to 2147483647 (68 years) on a create, the largest value Cloud's 32-bit
      lifetime columns hold.
  resources.max_process_seconds:
    tests: [coverage.facts.max_process]
    report: reports/tester-default-coverage.json
  lifetime_timer.enforced_by:
    tests: [lifetime_timer.at_end.destroyed]
    report: reports/tester-default-select.json
  lifetime_timer.at_end:
    tests: [lifetime_timer.at_end.destroyed]
    report: reports/tester-default-select.json
  lifetime_timer.counts_paused_time:
    source: https://docs.sailresearch.com/sailbox-openapi.json
    read: 2026-11-23
    quote: >-
      "Terminate this Sailbox after this many wall-clock seconds from creation, including
      time spent waiting for capacity, sleeping, or paused."
  gates.user_selection.0.commands:
    tests:
    - coverage.guest_user.selectable
    report: reports/tester-default-coverage.json
  gates.user_selection.0.files_write:
    tests:
    - coverage.guest_user.selectable
    report: reports/tester-default-coverage.json
  gates.user_selection.0.process_start:
    tests:
    - coverage.guest_user.selectable
    report: reports/tester-default-coverage.json
  gates.pause_resume.0.keeps:
    tests:
    - pause_resume.files_and_memory
    report: reports/tester-default-pause-resume.json
  gates.previews.0.access:
    tests:
    - previews.access.public
    report: reports/tester-default-previews.json
  gates.previews.0.revocable:
    tests:
    - previews.revocable.true.public
    report: reports/tester-default-previews.json
  gates.previews.0.any_port:
    tests:
    - coverage.previews.any_port
    report: reports/tester-default-previews.json
  gates.previews.0.link_lifetime_seconds:
    tests:
    - previews.link_lifetime_seconds.public
    report: reports/tester-default-previews.json
  gates.previews.0.reserved_ports:
    tests:
    - coverage.previews.reserved_ports
    report: reports/tester-default-previews.json
  gates.previews.0.survives_pause:
    tests:
    - coverage.previews.survives_pause
    report: reports/tester-default-previews.json
  gates.previews.0.websocket:
    tests:
    - coverage.previews.websocket
    report: reports/tester-default-previews.json
  gates.network_lockdown.0.policy:
    tests:
    - coverage.network_lockdown.allowlist.mixed
    report: reports/tester-default-network-lockdown.json
  gates.network_lockdown.0.entry_kinds:
    tests:
    - coverage.network_lockdown.allowlist.mixed
    report: reports/tester-default-network-lockdown.json
  gates.network_lockdown.0.allow_wildcards:
    tests:
    - network_lockdown.wildcards
    report: reports/tester-default-network-lockdown.json
  gates.network_lockdown.0.max_allow:
    tests:
    - network_lockdown.max_allow
    report: reports/tester-default-network-lockdown.json
  gates.network_lockdown.1.policy:
    tests:
    - coverage.network_lockdown.allowlist.mixed
    - network_lockdown.deny_all
    - coverage.network_lockdown.open
    report: reports/tester-default-network-lockdown.json
  gates.network_lockdown.1.entry_kinds:
    tests:
    - coverage.network_lockdown.allowlist.mixed
    report: reports/tester-default-network-lockdown.json
  gates.network_lockdown.1.allow_wildcards:
    tests:
    - network_lockdown.wildcards
    report: reports/tester-default-network-lockdown.json
  gates.network_lockdown.1.max_allow:
    tests:
    - network_lockdown.max_allow
    report: reports/tester-default-network-lockdown.json
  gates.network_lockdown.1.switchable:
    tests:
    - coverage.network_lockdown.switchable.true
    report: reports/tester-default-network-lockdown.json
  gates.network_lockdown.1.changeable:
    tests:
    - coverage.network_lockdown.changeable.true
    report: reports/tester-default-network-lockdown.json
  gates.custom_images.0.source:
    tests:
    - custom_images.provider_artifact
    report: reports/tester-default-custom-images.json
  gates.custom_images.1.source:
    tests:
    - custom_images.oci
    report: reports/tester-default-custom-images.json
  gates.custom_images.1.prepared:
    tests:
    - coverage.custom_images.prepare.registry
    report: reports/tester-default-custom-images.json
  gates.snapshots.0.keeps:
    tests:
    - snapshots.keeps.files_only
    report: reports/tester-default-snapshots.json
  gates.snapshots.0.deletable:
    tests:
    - snapshots.deletable.true
    report: reports/tester-default-snapshots.json
  gates.snapshots.0.retention_seconds:
    source: https://docs.sailresearch.com/sailboxes-forking.md
    read: 2026-11-24
    quote: >-
      A checkpoint is a durable snapshot with an id, an optional name, and an expiry. It lasts
      seven days by default unless you set a TTL.
