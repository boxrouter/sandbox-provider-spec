# Provider sentences, in the provider's folder: the benchmarks and pricing pages print them as published.
fact.open_source: Modal's runtime is proprietary. Its client SDK is open source under Apache-2.0.
fact.snapshots: Modal offers filesystem and directory snapshots. Memory snapshots are in alpha.
in_development.terminal-bench: our adapter starts sandboxes without a command, and this task's image has
  none, so the sandbox exits at once
note.size: Modal calls one physical core two vCPUs, but enforces CPU time; we request two cores so two
  CPUs can run at once.
note.preview-port-limit: Modal's Python SDK 1.6.1 documents encrypted_ports and unencrypted_ports
  as Sequence[int] (https://modal.com/docs/sdk/py/latest/Sandbox). The networking guide says to
  list forwarded ports at sandbox creation and does not publish a numeric cap
  (https://modal.com/docs/guide/sandbox-networking). The declaration states the verified minimum
  of two, with no upper bound. A live previews.listed_ports report exercises two simultaneous ports.
