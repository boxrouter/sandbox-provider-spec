spec: sandbox-provider-spec/0.1
provider: agent37
# Every value is `unknown` or absent until a committed run report or a dated quote of Agent37's
# documentation proves it. Kernel, regions and every gate but network_lockdown stay unknown
# until a report proves them.
verified:
  date: 2026-11-13
  # The client package the adapter calls Agent37 with: Agent37 publishes no SDK, so its HTTP client.
  sdks: {"httpx": "0.28.1"}
resources:
  kernel: unknown
  # Agent37's four shapes (instance sizing page). Each size's disk is the default a create that
  # sends no `disk` gets on a non-VM template; the adapter never sends `disk`.
  sizes:
  - {cpu: 2, memory_mib: 4096, disk_mib: 4096}
  - {cpu: 4, memory_mib: 8192, disk_mib: 6144}
  - {cpu: 4, memory_mib: 16384, disk_mib: 12288}
  - {cpu: 4, memory_mib: 32768, disk_mib: 24576}
  default_size: {cpu: 2, memory_mib: 4096, disk_mib: 4096}
  size_is_ceiling: true
  # Agent37's own default image (template agent37-base), proven by the cited adapter report.
  default_user: node
  default_cwd: /home/node
  gpus: unknown
  regions: unknown
  located_in: ["US"]
  # An instance has no lifetime timer, so this declaration has no `lifetime_timer` block: it
  # serves only requests that ask for no lifetime (`lifetime_seconds: null`).
  max_lifetime_seconds: unlimited
  paused_retention_seconds: unknown
  max_run_seconds: unknown
  max_process_seconds: unknown
  long_running: unknown
  extendable_lifetime: unknown
gates:
  # Agent37's `network` field (instance network page): "deny-all", "allow-all" or an allow list of
  # domains (HTTPS on 443, `*.` wildcards) and IPv4 addresses or ranges, set at create or changed
  # on a running instance by PATCH. It has no denylist. Agent37 documents up to 100 entries; the
  # suite's limit test lists 32, so 32 is what was seen working. Names and addresses are proven in
  # separate lists: the mixed-list probe reads Agent37's TLS refusal of an unlisted name as
  # ambiguous (not_run), so a list mixing both kinds stays unproven.
  network_lockdown:
    - policy: allowlist
      entry_kinds: [addresses]
    - policy: [deny_all, allowlist, open]
      entry_kinds: [names]
      allow_wildcards: true
      max_allow: {at_least: 32}
      switchable: true
evidence:
  resources.sizes:
    source: https://www.agent37.com/docs/agents-api/instance-sizing
    read: 2026-11-12
    quote: >-
      | 2 | 4 GB | 2-12 GB | $4.76 per month (the default) | | 4 | 8 GB | 2-20 GB | $9.34 per month |
      | 4 | 16 GB | 2-40 GB | $15.48 per month | | 4 | 32 GB | 2-80 GB | $27.76 per month | ...
      Other templates default to 4, 6, 12, or 24 GB disk by shape.
  resources.size_is_ceiling:
    tests: [coverage.facts.size_is_ceiling.true]
    report: reports/adapter-default-size-ceiling.json
  resources.default_size:
    source: https://www.agent37.com/docs/agents-api/instances/create
    read: 2026-11-12
    quote: >-
      The instance shape, for example `{ "cpu": 2, "memory": 4, "disk": 6 }`. Omitted, most
      templates use 2 vCPU / 4 GB. ... When omitted, it defaults to 12 GB for these two VM
      templates, or 4, 6, 12, or 24 GB by shape for other templates.
  resources.default_user:
    tests: [facts.default_user]
    report: reports/adapter-defaults.json
  resources.default_cwd:
    tests: [facts.default_cwd]
    report: reports/adapter-defaults.json
  resources.max_lifetime_seconds:
    source: https://www.agent37.com/docs/agents-api/concepts
    read: 2026-11-11
    quote: >-
      An isolated, persistent computer for code, services, or an agent harness. Built from a
      template. Lives until you delete it, metered per minute for what it holds
  resources.located_in:
    source: https://www.agent37.com/docs/agents-api/instances/create
    read: 2026-11-11
    quote: >-
      `us` is the only region that runs every instance type. `eu` and `ap-south` run VM and
      Performance instances, so a create in either should also send `"type": "vm"` or
      `"type": "performance"`. A `default` create there returns `400 invalid_request`
  gates.network_lockdown.1.policy:
    reports:
      - tests: [network_lockdown.deny_all, network_lockdown.allowlist.names]
        report: reports/network-lockdown.json
      - tests: [coverage.network_lockdown.open]
        report: reports/network-lockdown-coverage.json
  gates.network_lockdown.1.entry_kinds:
    tests: [network_lockdown.allowlist.names]
    report: reports/network-lockdown.json
  gates.network_lockdown.1.allow_wildcards:
    tests: [network_lockdown.wildcards]
    report: reports/network-lockdown.json
  gates.network_lockdown.1.max_allow:
    tests: [network_lockdown.max_allow]
    report: reports/network-lockdown.json
  gates.network_lockdown.1.switchable:
    tests: [coverage.network_lockdown.switchable.true]
    report: reports/network-lockdown-coverage.json
  gates.network_lockdown.0.policy:
    tests: [network_lockdown.allowlist.addresses]
    report: reports/network-lockdown-addresses.json
  gates.network_lockdown.0.entry_kinds:
    tests: [network_lockdown.allowlist.addresses]
    report: reports/network-lockdown-addresses.json
