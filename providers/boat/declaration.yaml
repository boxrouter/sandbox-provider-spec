spec: sandbox-provider-spec/0.1
provider: boat
verified:
  date: '2026-11-11'
  sdks:
    boat-sdk: 1.13.0
resources:
  kernel: dedicated
  sizes:
  - cpu: 2
    memory_mib: 4096
    disk_mib: 48637
  - cpu: 4
    memory_mib: 8192
    disk_mib: 48637
  default_size:
    cpu: 4
    memory_mib: 8192
    disk_mib: 48637
  max_lifetime_seconds: 2592000
  extendable_lifetime: true
  needs:
    max_lifetime_seconds:
    - paid_plan
  unmet_limits:
    max_lifetime_seconds:
      paid_plan: 7200
  gpus: unknown
  disk_mib: 48637
  regions: unknown
  located_in: [DE, FI, FR]
  paused_retention_seconds: unknown
  max_run_seconds: unknown
  long_running: unknown
  size_is_ceiling: true
  disk_in_memory: false
lifetime_timer:
  enforced_by: provider
  counts_paused_time: unknown
  at_end: [destroyed]
gates: {}
evidence:
  resources.extendable_lifetime:
    tests: [facts.extendable_lifetime]
    report: reports/lifetime-extend.json
  lifetime_timer.enforced_by:
    tests: [lifetime_timer.at_end.destroyed]
    report: reports/lifetime-at-end.json
  lifetime_timer.at_end:
    tests: [lifetime_timer.at_end.destroyed]
    report: reports/lifetime-at-end.json
  resources.size_is_ceiling:
    tests:
    - coverage.facts.size_is_ceiling.true
    report: reports/adapter-default-size-ceiling.json
  resources.disk_in_memory:
    tests:
    - coverage.facts.disk_in_memory.false
    report: reports/adapter-default-disk-in-memory.json
  resources.kernel:
    source: https://docs.boat.dev/machines
    read: '2026-11-01'
    quote: Each sandbox is a full Linux virtual machine with its own kernel.
  resources.sizes:
    source: https://docs.boat.dev/machines
    read: '2026-11-05'
    quote: '`small` | **$0.018** | 2 vCPU | 4 GB | 51 GB; `default` | **$0.036** | 4 vCPU | 8 GB | 51 GB'
  resources.located_in:
    source: https://docs.boat.dev/compliance
    read: '2026-11-10'
    quote: Sandboxes run on machines in Germany, Finland and France.
  resources.disk_mib:
    source: https://docs.boat.dev/machines
    read: '2026-11-11'
    quote: '`small` | **$0.018** | 2 vCPU | 4 GB | 51 GB; `default` | **$0.036** | 4 vCPU | 8 GB | 51 GB'
  resources.default_size:
    source: https://docs.boat.dev/machines
    read: '2026-11-01'
    quote: Without `--type`, you get `default` (the medium size).
  resources.max_lifetime_seconds:
    source: https://docs.boat.dev/free-trial
    read: '2026-11-08'
    quote: 'Auto-stop | Required, 2 hours maximum | Up to 30 days, or off'
  resources.needs.max_lifetime_seconds:
    source: https://docs.boat.dev/long-running-tasks/auto-stop
    read: '2026-11-01'
    quote: On the free trial, you cannot turn off auto-stop, and the TTL cannot be more than 2 hours.
  resources.unmet_limits.max_lifetime_seconds.paid_plan:
    source: https://docs.boat.dev/long-running-tasks/auto-stop
    read: '2026-11-01'
    quote: On the free trial, you cannot turn off auto-stop, and the TTL cannot be more than 2 hours.
