assets:
  mark.svg:
    source: https://www.beam.cloud/favicon.svg
    role: >-
      Official Beam symbol, the white glyph of the site's own favicon drawn here in one colour
      (black, so it follows the page's text colour); the logo and the mark are this one file
    modifications: >-
      The favicon's pixel-pattern background square and clip were removed and the glyph path was
