  no_brand_page: beam.cloud/brand and /press return 404; no brand kit was found
  no_wordmark: >-
    beam.cloud/beam-logo-white.svg is the word "beam" in white for dark backgrounds, so no lockup
    is shipped.
  terms: >-
    no reuse terms or brand guidelines were found; the mark is used to name Beam as a provider only.
