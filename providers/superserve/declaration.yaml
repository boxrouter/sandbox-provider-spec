spec: sandbox-provider-spec/0.1
provider: superserve
# Every value is `unknown`, absent, a dated quote of Superserve's documentation or a committed adapter
# report (see evidence.md).
verified:
  date: 2026-11-21
  # The official Superserve Python SDK, as in the adapter's spec.py `sdk_packages` (the open-source
  # export strips BoxRouter packages, so only the provider SDK is named here).
  sdks: {"superserve": "0.12.0", "sandbox-provider-spec": "0.5.58"}
resources:
  kernel: dedicated
  # A sandbox inherits its shape from the template it starts from and cannot override it, so each
  # size is a template's: the default template `superserve/base` (templates page; live check
  # 2026-11-13 in evidence.md) and the standard-image template the adapter builds itself
  # (image_preparation.py: 2 vCPU, 2048 MiB, 8192 MiB, the team's legacy Free cap).
  sizes:
  - {cpu: 2, memory_mib: 2048, disk_mib: 8192}
  - {cpu: 2, memory_mib: 4096, disk_mib: 8192}
  default_size: {cpu: 2, memory_mib: 4096, disk_mib: 8192}
  size_is_ceiling: true
  default_user: root
  default_cwd: /home/user
  gpus: unknown
  regions: unknown
  # Superserve's own bound on one timer window (`timeout_seconds`, 1 to 604800).
  max_lifetime_seconds: 604800
  paused_retention_seconds: 2592000
  max_run_seconds: unknown
  max_process_seconds: unknown
  long_running: unknown
  extendable_lifetime: unknown
lifetime_timer:
  enforced_by: provider
  counts_paused_time: false
  at_end: [destroyed]
gates:
  # `commands.spawn` (a stdin write and its explicit EOF, a signal that ends the process); no reattach,
  # because the service stops a command whose connection is gone.
  processes:
  - input: true
    cancel: true
    reattach: false
  # Superserve's `network` rules: `allow_out` takes addresses, CIDRs and domains with `*.` wildcards, and a
  # PATCH replaces both lists on an active sandbox. Not declared: deny_all (Superserve's refusal of an
  # unlisted name over TLS reads as ambiguous, so `network_lockdown.deny_all` is not_run), a denylist and
  # `changeable`.
  network_lockdown:
  - policy: allowlist
    entry_kinds: [names, addresses]
    allow_wildcards: true
  - policy: [allowlist, open]
    entry_kinds: [names, addresses]
    allow_wildcards: true
    switchable: true
  # A public OCI image is built as a team template and a sandbox boots from it; an image's ENTRYPOINT and
  # CMD do not run in a template-booted sandbox, and no template option takes registry credentials, so a
  # private registry image is refused. A template the caller names is a provider artifact.
  # A registry image becomes a team template whose `start_cmd` is the image's ENTRYPOINT and CMD, started once
  # while the template is built and kept alive in its snapshot (image_preparation.py); the template carries the
  # image's env, working directory and user. A template the caller names carries the same, but one BoxRouter
  # did not build has no recorded start command, so the adapter refuses `runs_entrypoint: true` for it.
  custom_images:
  - source: oci
    prepared: true
    image_config:
    - env
    - workdir
    - user
    runs_entrypoint: true
  - source: provider_artifact
    image_config:
    - env
    - workdir
    - user
    runs_entrypoint: true
  # Superserve's `pause` and `resume` keep processes and memory (`Pause.memory`, no cold restart). The adapter
  # swaps `auto_delete_seconds` 0 for the 30-day retention for the length of a caller's pause (lifecycle.py).
  pause_resume:
  - keeps: files_and_memory
  # `idle_timeout_seconds` (60 s to 7 days) pauses an idle sandbox; the adapter's `auto_delete_seconds: 0`
  # deletes it at that pause, so `on_idle` is `destroyed`.
  idle_shutdown:
  - custom_idle_time: true
    on_idle: destroyed
  # Preview URLs (previews.py): a public preview is the published port's URL; a private one adds a port-scoped
  # token carried in the URL (`link`, a 302 cookie bootstrap) or in a header. A revoke unpublishes the port.
  # `loopback` is not declared (evidence.md).
  previews:
  - access: public
    revocable: true
    max_ports:
      at_least: 2
    any_port: true
    link_lifetime_seconds:
      at_least: 120
    reserved_ports: [49983]
    websocket: true
    survives_pause: true
  - access: private
    credential: link
    revocable: true
    max_ports:
      at_least: 2
    any_port: true
    link_lifetime_seconds:
      at_least: 120
    reserved_ports: [49983]
    websocket: true
    survives_pause: true
  - access: private
    credential: header
    revocable: true
    max_ports:
      at_least: 2
    any_port: true
    link_lifetime_seconds:
      at_least: 120
    reserved_ports: [49983]
    websocket: true
    survives_pause: true
  # Superserve's exec takes a user; a file is staged by the file API (root) and copied by a command that runs as
  # that user (guest.COPY).
  user_selection:
  - commands: true
    files_write: true
    process_start: true
  # A pty under the guest supervisor (terminals.py): closing an observer never ends the shell.
  terminal:
  - reattach: true
  snapshots:
  - keeps: files_and_memory
    deletable: true
evidence:
  resources.kernel:
    source: https://docs.superserve.ai/sandbox/create.md
    read: 2026-11-16
    quote: Spin up an isolated Firecracker MicroVM in seconds, ready to run commands immediately.
  resources.sizes:
    source: https://docs.superserve.ai/templates/overview
    read: 2026-11-13
    quote: >-
      | `superserve/base` | `ubuntu:24.04` | 2 · 4096 MiB · 8192 MiB | ... A sandbox inherits its
      VM shape (vCPU, memory, disk) from the template it starts from
  resources.size_is_ceiling:
    tests:
    - coverage.facts.size_is_ceiling.true
    report: reports/prober-default-coverage.json
  resources.default_user:
    tests: [facts.default_user]
    report: reports/adapter-defaults.json
  resources.default_cwd:
    tests:
    - facts.default_cwd
    report: reports/prober-default-core.json
  resources.default_size:
    source: https://docs.superserve.ai/templates/overview
    read: 2026-11-13
    quote: >-
      | `superserve/base` | `ubuntu:24.04` | 2 · 4096 MiB · 8192 MiB |
  resources.max_lifetime_seconds:
    source: https://api.superserve.ai/openapi.yaml
    read: 2026-11-13
    quote: >-
      Optional auto-pause timeout in seconds. The sandbox is paused once its current active session has
      run this long; each resume starts a fresh window. When unset, the sandbox stays active until
      explicitly paused. Also settable later via `PATCH /sandboxes/{sandbox_id}`. Maximum 604800 (7 days).
  lifetime_timer.enforced_by:
    tests: [lifetime_timer.at_end.destroyed]
    report: reports/adapter-default.json
  lifetime_timer.at_end:
    tests: [lifetime_timer.at_end.destroyed]
    report: reports/adapter-default.json
  gates.processes.0.input:
    tests:
    - processes.input.true
    report: reports/prober-default-core.json
  gates.processes.0.cancel:
    tests:
    - processes.cancel.true
    report: reports/prober-default-core.json
  gates.processes.0.reattach:
    tests:
    - processes.reattach.false
    report: reports/prober-default-core.json
  gates.network_lockdown.0.policy:
    tests:
    - network_lockdown.allowlist.names
    - network_lockdown.allowlist.addresses
    report: reports/prober-default-core.json
  gates.network_lockdown.0.entry_kinds:
    tests:
    - network_lockdown.allowlist.names
    - network_lockdown.allowlist.addresses
    report: reports/prober-default-core.json
  gates.network_lockdown.0.allow_wildcards:
    tests:
    - network_lockdown.wildcards
    report: reports/prober-default-core.json
  gates.network_lockdown.1.policy:
    reports:
    - tests:
      - network_lockdown.allowlist.names
      - network_lockdown.allowlist.addresses
      report: reports/prober-default-core.json
    - tests:
      - coverage.network_lockdown.open
      report: reports/prober-default-coverage.json
  gates.network_lockdown.1.entry_kinds:
    tests:
    - network_lockdown.allowlist.names
    - network_lockdown.allowlist.addresses
    report: reports/prober-default-core.json
  gates.network_lockdown.1.allow_wildcards:
    tests:
    - network_lockdown.wildcards
    report: reports/prober-default-core.json
  gates.network_lockdown.1.switchable:
    tests:
    - coverage.network_lockdown.switchable.true
    report: reports/prober-default-coverage.json
  gates.custom_images.0.source:
    tests:
    - custom_images.oci
    report: reports/prober-default-core.json
  gates.custom_images.0.prepared:
    tests:
    - coverage.custom_images.prepare.registry
    report: reports/prober-default-coverage.json
  gates.custom_images.0.runs_entrypoint:
    tests:
    - coverage.custom_images.runs_entrypoint.true
    report: reports/prober-default-coverage.json
  gates.custom_images.0.image_config:
    tests:
    - coverage.custom_images.prepare.image_config.env
    - coverage.custom_images.prepare.image_config.workdir
    - coverage.custom_images.prepare.image_config.user
    report: reports/prober-default-coverage.json
  gates.custom_images.1.source:
    tests:
    - custom_images.provider_artifact
    report: reports/prober-default-core.json
  gates.custom_images.1.runs_entrypoint:
    tests:
    - coverage.custom_images.runs_entrypoint.true
    report: reports/prober-default-coverage.json
  gates.custom_images.1.image_config:
    tests:
    - coverage.custom_images.prepare.image_config.env
    - coverage.custom_images.prepare.image_config.workdir
    - coverage.custom_images.prepare.image_config.user
    report: reports/prober-default-coverage.json
  resources.paused_retention_seconds:
    source: https://api.superserve.ai/openapi.yaml
    read: 2026-11-14
    quote: >-
      `auto_delete_seconds` ... Optional garbage-collection window for paused sandboxes, in seconds. Once the
      sandbox has been continuously paused for this long it is deleted automatically. ... Maximum 2592000 (30 days).
  lifetime_timer.counts_paused_time:
    source: https://api.superserve.ai/openapi.yaml
    read: 2026-11-14
    quote: >-
      `timeout_seconds` ... The sandbox is paused once its current active session has run this long; each
      resume starts a fresh window.
  gates.pause_resume.0.keeps:
    tests:
    - pause_resume.files_and_memory
    report: reports/prober-default-core.json
  gates.idle_shutdown.0.custom_idle_time:
    tests:
    - idle_shutdown.custom_idle_time.true
    report: reports/prober-default-core.json
  gates.idle_shutdown.0.on_idle:
