spec: sandbox-provider-spec/0.1
provider: maritime
class: default
# Every value is `unknown`, absent, a dated quote of Maritime's documentation or a committed
# tester report (the `sps-provider-maritime` adapter over Maritime's HTTP API, control plane
# api.maritime.sh plus the per-sandbox data plane the create answer carries). The adapter
# serves the baseline surface, directories, labels.update, account.capacity and
# resume.lifetime, and discovery states five gates (pause/resume, previews, network
# lockdown, processes and snapshots; custom images and idle shutdown stay unclaimed
# pending fixtures). Everything else stays unknown until a run report proves it.
verified:
  date: 2026-11-24
  # The adapter calls Maritime's HTTP API through httpx, not Maritime's own SDK; the newest
  # report records the tester stack it ran with.
  sdks: {"httpx": "0.28.1", "sandbox-provider-spec": "0.5.112"}
resources:
  kernel: dedicated
  arch: [amd64]
  libc: glibc
  package_manager: apt
  disk_in_memory: false
  # One range. A size is any vCPU, memory and disk inside it: Maritime sells exact resources, not
  # only presets. The vCPU and memory bounds are the documented ones. The disk upper bound is the
  # 100 GiB (`maxDiskGb`) that Maritime's account-limits endpoint stated for the account the
  # adapter was run against, under the documented 500 GiB; the lower bound is the 12 GiB `small`
  # preset's, the smallest disk a request that names none lands on, not the 5 GiB the API accepts.
  # The adapter's discovery states the same range.
  sizes:
  - cpu: [1, 16]
    memory_mib: [1024, 65536]
    disk_mib: [12288, 102400]
  size_is_ceiling: unknown
  default_user: user
  default_cwd: /home/user
  root: [sudo]
  gpus: unknown
  regions: unknown
  # `timeLimitSeconds` on a create takes 60 to 86400; a longer request is refused, not
  # clamped. The ephemeral-extend endpoint moves a running sandbox's deadline out.
  max_lifetime_seconds: 86400
  max_run_seconds: unknown
  max_process_seconds: {at_least: 600}
  on_memory_exhausted: process_killed
  extendable_lifetime: unknown
  paused_retention_seconds: unknown
lifetime_timer:
  enforced_by: provider
  counts_paused_time: true
  at_end: [destroyed]
# The gates the committed core report proves: snapshots keep files and memory and delete,
# a resume keeps files and memory, background processes cancel and reattach, previews publish
# any guest port on public or private access with the credential in the link, and the egress
# policy is an allowlist of host names (with `*.` wildcards), `deny_all` or `open`, replaceable
# on a running sandbox. idle_shutdown and custom_images stay out: their suite rows need
# fixtures Maritime's timings cannot meet (idle granularity, a provider-artifact image).
gates:
  previews:
  - access: [public, private]
    credential: link
    any_port: true
  pause_resume:
  - keeps: files_and_memory
  processes:
  - cancel: true
    reattach: true
  snapshots:
  - keeps: files_and_memory
    deletable: true
  network_lockdown:
  - policy: allowlist
    entry_kinds: [names]
    allow_wildcards: true
  - policy: [allowlist, deny_all, open]
    entry_kinds: [names]
    allow_wildcards: true
    switchable: true
    changeable: true
evidence:
  resources.kernel:
    source: https://maritime.sh/docs/ephemeral-sandboxes
    read: '2026-11-24'
    quote: >-
      "Each one is its own micro-VM on the VM engine, with its own kernel."
  resources.sizes:
    source: https://maritime.sh/docs/limits
    read: '2026-11-25'
    quote: >-
      Virtual machine and swarm virtual machine sizes: any size instead of the allocation
      above: vcpu 1 to 16, memoryMib 1,024 to 65,536 (whole GiB), diskGib 5 to 500. Presets:
      small 2 vCPU, 4 GB, 12 GB disk (default) · medium 4 vCPU, 8 GB, 50 GB · large 8 vCPU,
      16 GB, 125 GB · xlarge 16 vCPU, 32 GB, 250 GB. GET /api/v1/account/limits returns the
      numbers your account runs under now: your plan, included machines, the awake cap, how
      many machines are awake, the size ceilings.
  resources.arch:
    tests: [coverage.facts.arch.amd64]
    report: reports/tester-default-coverage.json
  resources.libc:
    tests: [coverage.facts.libc.glibc]
    report: reports/tester-default-coverage.json
  resources.package_manager:
    tests: [coverage.facts.package_manager.apt]
    report: reports/tester-default-coverage.json
  resources.disk_in_memory:
    tests: [coverage.facts.disk_in_memory.false]
    report: reports/tester-default-coverage.json
  resources.default_user:
    tests: [facts.default_user]
    report: reports/tester-default-select.json
  resources.default_cwd:
    tests: [facts.default_cwd]
    report: reports/tester-default-select.json
  resources.root:
    tests: [coverage.facts.root.sudo]
    report: reports/tester-default-coverage.json
  resources.max_lifetime_seconds:
    source: https://maritime.sh/docs/ephemeral-sandboxes
    read: '2026-11-24'
    quote: >-
      `timeLimitSeconds` on a create takes 60 to 86400, as the Maritime SDK documents; a
      longer request is refused.
  resources.max_process_seconds:
    tests: [coverage.facts.max_process]
    report: reports/tester-default-coverage.json
  resources.on_memory_exhausted:
    tests: [coverage.facts.on_memory_exhausted.process_killed]
    report: reports/tester-default-coverage.json
  lifetime_timer.enforced_by:
    source: https://maritime.sh/docs/ephemeral-sandboxes
    read: '2026-11-24'
    quote: >-
      "When it has been idle for a few minutes, or when its time limit passes, Maritime ends
      the machine and its disk." The deadline is a wall-clock instant, so paused time counts.
  lifetime_timer.counts_paused_time:
    source: https://maritime.sh/docs/ephemeral-sandboxes
    read: '2026-11-24'
    quote: >-
      "When it has been idle for a few minutes, or when its time limit passes, Maritime ends
      the machine and its disk." The deadline is a wall-clock instant, so paused time counts.
  lifetime_timer.at_end:
    source: https://maritime.sh/docs/ephemeral-sandboxes
    read: '2026-11-24'
    quote: >-
      "When it has been idle for a few minutes, or when its time limit passes, Maritime ends
      the machine and its disk."
  gates.previews.0.access:
    tests: [previews.access.public, previews.access.private]
    report: reports/tester-default-core.json
  gates.previews.0.credential:
    tests: [previews.credential.link]
    report: reports/tester-default-core.json
  gates.previews.0.any_port:
    tests: [coverage.previews.any_port]
    report: reports/tester-default-coverage.json
  gates.pause_resume.0.keeps:
    tests: [pause_resume.files_and_memory]
    report: reports/tester-default-core.json
  gates.processes.0.cancel:
    tests: [processes.cancel.true]
    report: reports/tester-default-core.json
  gates.processes.0.reattach:
    tests: [processes.reattach.true]
    report: reports/tester-default-core.json
  gates.snapshots.0.keeps:
    tests: [snapshots.keeps.files_and_memory]
    report: reports/tester-default-core.json
  gates.snapshots.0.deletable:
    tests: [snapshots.deletable.true]
    report: reports/tester-default-core.json
  gates.network_lockdown.0.policy:
    tests: [network_lockdown.allowlist.names]
    report: reports/tester-default-core.json
  gates.network_lockdown.0.entry_kinds:
    tests: [network_lockdown.allowlist.names]
    report: reports/tester-default-core.json
  gates.network_lockdown.0.allow_wildcards:
    tests: [network_lockdown.wildcards]
    report: reports/tester-default-core.json
  gates.network_lockdown.1.policy:
    reports:
    - report: reports/tester-default-core.json
      tests: [network_lockdown.deny_all, network_lockdown.allowlist.names]
    - report: reports/tester-default-coverage.json
      tests: [coverage.network_lockdown.open]
  gates.network_lockdown.1.entry_kinds:
    tests: [network_lockdown.allowlist.names]
    report: reports/tester-default-core.json
  gates.network_lockdown.1.allow_wildcards:
    tests: [network_lockdown.wildcards]
    report: reports/tester-default-core.json
  gates.network_lockdown.1.switchable:
    tests: [coverage.network_lockdown.switchable.true, coverage.network_lockdown.open]
    report: reports/tester-default-coverage.json
  gates.network_lockdown.1.changeable:
    tests: [coverage.network_lockdown.changeable.true]
    report: reports/tester-default-coverage.json
