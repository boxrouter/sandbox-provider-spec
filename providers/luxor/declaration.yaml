spec: sandbox-provider-spec/0.1
provider: luxor
# Every value is `unknown`, absent or backed by a committed tester report or a dated quote of Luxor's own
# documentation (evidence.md says what each rests on and what is left out).
verified:
  date: 2026-11-24
  # Luxor's SDKs are not run: the adapter calls the control and data plane as Connect JSON over httpx.
  sdks: {"sandbox-provider-spec": "0.5.116"}
resources:
  kernel: dedicated
  # A Team workspace takes 16 cores and 64 GB; a Starter one is capped at 4 cores and 8 GB (`unmet_limits`).
  sizes:
  - cpu: [1, 16]
    memory_mib: [512, 65536]
    disk_mib: [5120, 102400]
  needs:
    sizes:
    - team_plan
  unmet_limits:
    sizes:
      team_plan:
        cpu: 4
        memory_mib: 8192
  default_size:
    cpu: 2
    memory_mib: 4096
    disk_mib: 5120
  gpus: unknown
  regions: unknown
  long_running: unknown
  # Luxor's own timer pauses a session at its end; the lifetime is enforced by the router (below).
  max_lifetime_seconds: unlimited
  extendable_lifetime: unknown
  default_user: tenki
  default_cwd: /home/tenki
  root: [sudo]
  arch: [amd64]
  libc: glibc
  package_manager: apt
  disk_in_memory: false
lifetime_timer:
  enforced_by: router
  counts_paused_time: true
  at_end: destroyed
gates:
  idle_shutdown: unsupported
  pause_resume:
  - keeps: files_and_memory
  processes:
  - input: true
    cancel: true
    reattach: true
  snapshots:
  - keeps: files_and_memory
    original_after: briefly_paused
    deletable: true
  previews:
  - access: public
    revocable: true
    any_port: true
  network_lockdown:
  - policy: [deny_all, allowlist]
    entry_kinds: [names]
    allow_wildcards: true
    max_allow: {at_least: 32}
    changeable: false
  - policy: [deny_all, allowlist]
    entry_kinds: [addresses]
    allow_wildcards: true
    max_allow: {at_least: 32}
    changeable: false
  - policy: [deny_all, allowlist]
    entry_kinds: [names, addresses]
    allow_wildcards: true
    max_allow: {at_least: 32}
    changeable: false
evidence:
  resources.kernel:
    source: https://luxor.ai/docs/sandbox/concepts
    read: '2026-11-24'
    quote: "A running full Linux VM"
  resources.sizes:
    source: https://luxor.ai/pricing
    read: '2026-11-27'
    quote: "Machine size | 4 cores, 8 GB RAM | 16 cores, 64 GB RAM"
  resources.needs.sizes:
    source: https://luxor.ai/pricing
    read: '2026-11-27'
    quote: "Machine size | 4 cores, 8 GB RAM | 16 cores, 64 GB RAM"
  resources.unmet_limits.sizes.team_plan:
    source: https://luxor.ai/pricing
    read: '2026-11-27'
    quote: "Machine size | 4 cores, 8 GB RAM | 16 cores, 64 GB RAM"
  resources.default_size:
    source: https://luxor.ai/docs/sandbox/sessions
    read: '2026-11-24'
    quote: "Unset options fall back to service defaults of 2 vCPU, 4096 MB, and a 5 GiB root disk."
  gates.idle_shutdown:
    source: https://luxor.ai/docs/sandbox/product
    read: '2026-11-24'
    quote: "Sandboxes are not paused for inactivity: a running sandbox accrues compute charges until you pause or terminate it"
  resources.max_lifetime_seconds:
    source: https://luxor.ai/docs/sandbox/sessions
    read: '2026-11-24'
    quote: "A sticky session runs until you terminate it."
  resources.default_user:
    tests:
    - facts.default_user
    report: reports/tester-default-select.json
  resources.default_cwd:
    tests:
    - facts.default_cwd
    report: reports/tester-default-select.json
  resources.root:
    tests:
    - coverage.facts.root.sudo
    report: reports/tester-default-coverage.json
  resources.arch:
    tests:
    - coverage.facts.arch.amd64
    report: reports/tester-default-coverage.json
  resources.libc:
    tests:
    - coverage.facts.libc.glibc
    report: reports/tester-default-coverage.json
  resources.package_manager:
    tests:
    - coverage.facts.package_manager.apt
    report: reports/tester-default-coverage.json
  resources.disk_in_memory:
    tests:
    - coverage.facts.disk_in_memory.false
    report: reports/tester-default-coverage.json
  lifetime_timer.enforced_by:
    source: https://github.com/boxrouter/sandbox-provider-spec/blob/main/spec/declarations.md
    read: '2026-11-24'
    quote: >-
      `router` when BoxRouter's bounded lease and sweeper do.
  lifetime_timer.counts_paused_time:
    source: https://github.com/boxrouter/sandbox-provider-spec/blob/main/spec/declarations.md
    read: '2026-11-24'
    quote: A router-enforced lifetime counts paused time.
  lifetime_timer.at_end:
    source: https://github.com/boxrouter/sandbox-provider-spec/blob/main/spec/declarations.md
    read: '2026-11-24'
    quote: A router-enforced lifetime destroys the sandbox.
  gates.pause_resume.0.keeps:
    tests:
    - pause_resume.files_and_memory
    report: reports/tester-default-core.json
  gates.processes.0.cancel:
    tests:
    - processes.cancel.true
    report: reports/tester-default-select.json
  gates.processes.0.reattach:
    tests:
    - processes.reattach.true
    report: reports/tester-default-select.json
  gates.processes.0.input:
    tests:
    - processes.input.true
    report: reports/tester-default-core.json
  gates.snapshots.0.keeps:
    tests:
    - snapshots.keeps.files_and_memory
    report: reports/tester-default-core.json
  gates.snapshots.0.original_after:
    tests:
    - snapshots.original_after.briefly_paused
    report: reports/tester-default-core.json
  gates.snapshots.0.deletable:
    tests:
    - snapshots.deletable.true
    report: reports/tester-default-core.json
  gates.previews.0.access:
    tests:
    - previews.access.public
    report: reports/tester-default-core.json
  gates.previews.0.revocable:
    tests:
    - previews.revocable.true.public
    report: reports/tester-default-core.json
  gates.previews.0.any_port:
    tests:
    - coverage.previews.any_port
    report: reports/tester-default-coverage.json
  gates.network_lockdown.0.policy:
    tests:
    - network_lockdown.deny_all
    - network_lockdown.allowlist.names
    report: reports/tester-default-core.json
  gates.network_lockdown.0.entry_kinds:
    tests:
    - network_lockdown.allowlist.names
    report: reports/tester-default-core.json
  gates.network_lockdown.0.allow_wildcards:
    tests:
    - network_lockdown.wildcards
    report: reports/tester-default-core.json
  gates.network_lockdown.0.max_allow:
    tests:
    - network_lockdown.max_allow
    report: reports/tester-default-core.json
  gates.network_lockdown.0.changeable:
    tests:
    - coverage.network_lockdown.changeable.false
    report: reports/tester-default-coverage.json
  gates.network_lockdown.1.policy:
    tests:
    - network_lockdown.deny_all
    - network_lockdown.allowlist.addresses
    report: reports/tester-default-core.json
  gates.network_lockdown.1.entry_kinds:
    tests:
    - network_lockdown.allowlist.addresses
    report: reports/tester-default-core.json
  gates.network_lockdown.1.allow_wildcards:
    tests:
    - network_lockdown.wildcards
    report: reports/tester-default-core.json
  gates.network_lockdown.1.max_allow:
    tests:
    - network_lockdown.max_allow
    report: reports/tester-default-core.json
  gates.network_lockdown.1.changeable:
    tests:
    - coverage.network_lockdown.changeable.false
    report: reports/tester-default-coverage.json
  gates.network_lockdown.2.policy:
    tests:
    - network_lockdown.deny_all
    - coverage.network_lockdown.allowlist.mixed
    report: reports/tester-default-claims-20261124.json
  gates.network_lockdown.2.entry_kinds:
    tests:
    - coverage.network_lockdown.allowlist.mixed
    report: reports/tester-default-coverage.json
  gates.network_lockdown.2.allow_wildcards:
    tests:
    - network_lockdown.wildcards
    report: reports/tester-default-core.json
  gates.network_lockdown.2.max_allow:
    tests:
    - network_lockdown.max_allow
    report: reports/tester-default-core.json
  gates.network_lockdown.2.changeable:
    tests:
    - coverage.network_lockdown.changeable.false
    report: reports/tester-default-coverage.json
