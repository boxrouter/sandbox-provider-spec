spec: sandbox-provider-spec/0.1
provider: luxor
# Every value is `unknown`, absent or backed by a committed tester report or a dated quote of Luxor's own
# documentation (evidence.md says what each rests on and what is left out).
verified:
  date: 2026-11-24
  # Luxor's SDKs are not run: the adapter calls the control and data plane as Connect JSON over httpx.
  sdks: {"sandbox-provider-spec": "0.5.103"}
resources:
  kernel: unknown
  sizes: unknown
  gpus: unknown
  regions: unknown
  long_running: unknown
  # Luxor's own timer pauses a session at its end; the lifetime is enforced by the router (below).
  max_lifetime_seconds: unlimited
  extendable_lifetime: unknown
  default_user: tenki
  default_cwd: /home/tenki
  root: [sudo]
  arch: [amd64]
  libc: glibc
  package_manager: apt
  disk_in_memory: false
lifetime_timer:
  enforced_by: router
  counts_paused_time: true
  at_end: destroyed
gates:
  pause_resume:
  - keeps: files_and_memory
  processes:
  - cancel: true
    reattach: true
evidence:
  resources.max_lifetime_seconds:
    source: https://luxor.ai/docs/sandbox/sessions
    read: '2026-11-24'
    quote: "A sticky session runs until you terminate it."
  resources.default_user:
    tests:
    - facts.default_user
    report: reports/tester-default-select.json
  resources.default_cwd:
    tests:
    - facts.default_cwd
    report: reports/tester-default-select.json
  resources.root:
    tests:
    - coverage.facts.root.sudo
    report: reports/tester-default-coverage.json
  resources.arch:
    tests:
    - coverage.facts.arch.amd64
    report: reports/tester-default-coverage.json
  resources.libc:
    tests:
    - coverage.facts.libc.glibc
    report: reports/tester-default-coverage.json
  resources.package_manager:
    tests:
    - coverage.facts.package_manager.apt
    report: reports/tester-default-coverage.json
  resources.disk_in_memory:
    tests:
    - coverage.facts.disk_in_memory.false
    report: reports/tester-default-coverage.json
  lifetime_timer.enforced_by:
    source: https://github.com/boxrouter/sandbox-provider-spec/blob/main/spec/declarations.md
    read: '2026-11-24'
    quote: >-
      `router` when BoxRouter's bounded lease and sweeper do.
  lifetime_timer.counts_paused_time:
    source: https://github.com/boxrouter/sandbox-provider-spec/blob/main/spec/declarations.md
    read: '2026-11-24'
    quote: A router-enforced lifetime counts paused time.
  lifetime_timer.at_end:
    source: https://github.com/boxrouter/sandbox-provider-spec/blob/main/spec/declarations.md
    read: '2026-11-24'
    quote: A router-enforced lifetime destroys the sandbox.
  gates.pause_resume.0.keeps:
    tests:
    - pause_resume.files_and_memory
    report: reports/tester-default-core.json
  gates.processes.0.cancel:
    tests:
    - processes.cancel.true
    report: reports/tester-default-select.json
  gates.processes.0.reattach:
    tests:
    - processes.reattach.true
    report: reports/tester-default-select.json
