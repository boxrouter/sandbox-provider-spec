    post:
      operationId: image_prepare
      tags: [optional]
      summary: Prepare an image ahead of creation (idempotent)
      description: >-
        Section `images` (`classes[].operations`; the class also claims `custom_images` knob `prepared`). The body is
        `multipart/form-data`: the part `request` (JSON, first) and, for a Dockerfile that copies files, the part `context`
        (a tar archive of the build context). The context never travels inside JSON and a server reads it as a stream. The
        provider reaches no registry: `config` and `digest` are the caller's. The provider makes any OCI image or Dockerfile
        runnable and never treats one image differently by its name or reference. Returns once the provider has accepted the
        work, with state `preparing`, `ready` or `failed`; read `image_get` until `ready`. A repeat with the same key and
        the same request returns the first image with status 201.
      parameters:
        - {$ref: "#/components/parameters/IdempotencyKey"}
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [request]
              properties:
                request: {$ref: "#/components/schemas/ImageRequest"}
                context:
                  type: string
                  format: binary
                  description: >-
                    A tar archive of the Dockerfile's build context, at most `limits.image_context_bytes`. The part may carry
                    a `Content-Length` header; when it does, the provider receives it as `context_size`. It follows `request`.
            encoding:
              request: {contentType: application/json}
              context: {contentType: application/x-tar}
      responses:
        "201":
          description: The image started by this call or found by its idempotency key.
          headers:
            Request-Id: {$ref: "#/components/headers/RequestId"}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/PreparedImage"}
