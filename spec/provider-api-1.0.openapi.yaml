openapi: 3.1.0
info:
  title: Sandbox Provider API
  version: 1.0.0
  summary: The operations that a sandbox provider implements.
  description: |
    A provider implements ten required operations and any of the optional ones. This file is the
    authority for the shapes of every request and result. The rules that span operations
    (idempotency, lifetime, ids, destroy, files, processes, cost, errors, versioning) are in
    provider-api.md next to this file.

    Every operation has a dotted name, such as `files.read`. The `operationId` is that name with
    each dot replaced by an underscore (`files_read`).
  license:
    name: Apache-2.0
    identifier: Apache-2.0
servers:
  - url: "{base_url}"
    description: The HTTPS base URL that the provider chooses. Every path is relative to it.
    variables:
      base_url:
        default: https://api.example.com/sps
        description: The provider's base URL, without a trailing slash.
security:
  - bearerAuth: []
tags:
  - name: required
    description: The ten operations that every provider implements.
  - name: optional
    description: >-
      Operations that a provider offers or claims in discovery, and that the tester turns on: those of the optional
      sections, and `cost`, which a provider offers by stating `limits.cost_final_within_seconds`.
paths:
  /v1/discovery:
    get:
      operationId: discovery
      tags: [required]
      summary: What this account can create, and the prices
      description: >-
        Account-scoped. Two accounts on different plans may see different classes, regions and sizes. Prices are list prices:
        a plan or discount on an account never changes them.
      responses:
        "200":
          description: The discovery document.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Discovery"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "429": {$ref: "#/components/responses/RateLimited"}
        "500": {$ref: "#/components/responses/ProviderError"}
        "503": {$ref: "#/components/responses/Unavailable"}
        "504": {$ref: "#/components/responses/Timeout"}
  /v1/sandboxes:
    post:
      operationId: create
      tags: [required]
      summary: Create a sandbox (idempotent)
      description: >-
        Returns when the sandbox can serve `run`, `files.*` and `process.*`; its state is `running`.
        A repeat with the same key and body returns the first sandbox with status 201.
      parameters:
        - {$ref: "#/components/parameters/IdempotencyKey"}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/CreateRequest"}
      responses:
        "201":
          description: The sandbox created by this call or found by its idempotency key.
          headers:
            Request-Id: {$ref: "#/components/headers/RequestId"}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Sandbox"}
        "400": {$ref: "#/components/responses/InvalidRequest"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "402": {$ref: "#/components/responses/QuotaExceeded"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "409": {$ref: "#/components/responses/Conflict"}
        "422": {$ref: "#/components/responses/Unsupported"}
        "429": {$ref: "#/components/responses/RateLimited"}
        "500": {$ref: "#/components/responses/ProviderError"}
        "503": {$ref: "#/components/responses/Unavailable"}
        "504": {$ref: "#/components/responses/Timeout"}
    get:
      operationId: list
      tags: [required]
      summary: List sandboxes that have not ended, filtered by labels
      description: >-
        Returns sandboxes in the states `running`, `paused` and `stopped`. The order is unspecified and the cursor is opaque.
        A sandbox created or ended during paging may appear twice or not at all.
      parameters:
        - name: label
          in: query
          required: false
          description: >-
            `<key>=<value>`; may repeat. A sandbox matches when it has every given label with exactly that value.
            The first `=` separates the key from the value.
          style: form
          explode: true
          schema:
            type: array
            items: {type: string, pattern: "^[^=]+=.*$"}
        - name: cursor
          in: query
          required: false
          description: The `next_cursor` of the previous page.
          schema: {type: string, minLength: 1}
        - name: limit
          in: query
          required: false
          description: Page size, 1 to `limits.list_limit` of discovery.
          schema: {type: integer, minimum: 1, default: 100}
      responses:
        "200":
          description: One page of sandboxes.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/SandboxPage"}
        "400": {$ref: "#/components/responses/InvalidRequest"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "429": {$ref: "#/components/responses/RateLimited"}
        "500": {$ref: "#/components/responses/ProviderError"}
        "503": {$ref: "#/components/responses/Unavailable"}
        "504": {$ref: "#/components/responses/Timeout"}
  /v1/sandboxes/{sandbox_id}:
    parameters:
      - {$ref: "#/components/parameters/SandboxId"}
    get:
      operationId: get
      tags: [required]
      summary: Read one sandbox
      description: >-
        Returns the current state. While the provider keeps a record of an ended sandbox, the state is `destroyed`;
        afterwards the answer is `not_found`. It observes only: it never resumes, wakes or extends a sandbox.
      responses:
        "200":
          description: The sandbox.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Sandbox"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "429": {$ref: "#/components/responses/RateLimited"}
        "500": {$ref: "#/components/responses/ProviderError"}
        "503": {$ref: "#/components/responses/Unavailable"}
        "504": {$ref: "#/components/responses/Timeout"}
    delete:
      operationId: destroy
      tags: [required]
      summary: End a sandbox; returns once accepted
      description: >-
        Returns as soon as the provider has accepted the request: the sandbox will end without any further call.
        A repeated destroy of an ending or ended sandbox succeeds with state `destroyed`. A destroy of an id that the
        provider has no record of is `not_found`, which a consumer treats as done.
      responses:
        "200":
          description: The destroy was accepted.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/DestroyResult"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "429": {$ref: "#/components/responses/RateLimited"}
        "500": {$ref: "#/components/responses/ProviderError"}
        "503": {$ref: "#/components/responses/Unavailable"}
        "504": {$ref: "#/components/responses/Timeout"}
  /v1/sandboxes/{sandbox_id}/labels:
    parameters:
      - {$ref: "#/components/parameters/SandboxId"}
    patch:
      operationId: labels_update
      tags: [optional]
      summary: Set and remove labels of a sandbox
      description: >-
        Listed as `labels.update` in `classes[].operations`. Each key in `labels` is set to its value, and an empty
        string removes the key; keys that are not named stay as they are. The result has at most 32 labels. A provider may
        refuse to change a label that is part of the sandbox's identity with `conflict`.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/LabelsUpdateRequest"}
      responses:
        "200":
          description: The sandbox with its new labels.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Sandbox"}
        "400": {$ref: "#/components/responses/InvalidRequest"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
        "422": {$ref: "#/components/responses/Unsupported"}
        "429": {$ref: "#/components/responses/RateLimited"}
        "500": {$ref: "#/components/responses/ProviderError"}
        "503": {$ref: "#/components/responses/Unavailable"}
        "504": {$ref: "#/components/responses/Timeout"}
  /v1/sandboxes/{sandbox_id}/network:
    parameters:
      - {$ref: "#/components/parameters/SandboxId"}
    put:
      operationId: network_update
      tags: [optional]
      summary: Replace a running sandbox's network policy
      description: >-
        Section `network_lockdown`: offered by a class whose variant states `switchable: true` (the sandbox can change to a
        policy in `switches_to`) or `changeable: true` (the entries of its policy can change). The body has the same
        `policy`, `allow` and `deny` as the `network_lockdown` requirement of `create`. Returns once the new policy holds:
        connections opened after the call follow it, and the sandbox keeps its processes and files. A policy that the
        sandbox's variant does not offer (not in its `switches_to`, or entries that its policy may not change), and a sandbox
        created without `network_lockdown`, are refused with `unsupported`.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/NetworkUpdateRequest"}
      responses:
        "200":
          description: The new policy holds.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/EmptyObject"}
        "400": {$ref: "#/components/responses/InvalidRequest"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
        "422": {$ref: "#/components/responses/Unsupported"}
        "429": {$ref: "#/components/responses/RateLimited"}
        "500": {$ref: "#/components/responses/ProviderError"}
        "503": {$ref: "#/components/responses/Unavailable"}
        "504": {$ref: "#/components/responses/Timeout"}
  /v1/sandboxes/{sandbox_id}/run:
    parameters:
      - {$ref: "#/components/parameters/SandboxId"}
    post:
      operationId: run
      tags: [required]
      summary: Run a command and return its exit code and output
      description: >-
        The call is held open until the command ends. A nonzero exit code and a timeout are results, not errors.
        For longer work, use `process.start`.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/RunRequest"}
      responses:
        "200":
          description: The command ended, or timed out.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/RunResult"}
        "400": {$ref: "#/components/responses/InvalidRequest"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
        "429": {$ref: "#/components/responses/RateLimited"}
        "500": {$ref: "#/components/responses/ProviderError"}
        "503": {$ref: "#/components/responses/Unavailable"}
        "504": {$ref: "#/components/responses/Timeout"}
  /v1/sandboxes/{sandbox_id}/files:
    parameters:
      - {$ref: "#/components/parameters/SandboxId"}
      - {$ref: "#/components/parameters/FilePathQuery"}
    get:
      operationId: files_read
      tags: [required]
      summary: Read a file as a byte stream
      description: >-
        The body is the whole file or the response fails: a connection that ends before the last byte is a failed read,
        never a short file. A consumer that needs only a prefix may close the stream early. A missing file is
        `not_found`, a directory is `invalid_request`, and a file over `limits.file_bytes` is `too_large`.
      responses:
        "200":
          description: The file's bytes.
          headers:
            Content-Length:
              description: The size in bytes, when the provider knows it. Otherwise the body uses chunked transfer.
              schema: {type: integer, minimum: 0}
          content:
            application/octet-stream:
              schema: {type: string, contentMediaType: application/octet-stream}
        "400": {$ref: "#/components/responses/InvalidRequest"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
        "413": {$ref: "#/components/responses/TooLarge"}
        "429": {$ref: "#/components/responses/RateLimited"}
        "500": {$ref: "#/components/responses/ProviderError"}
        "503": {$ref: "#/components/responses/Unavailable"}
        "504": {$ref: "#/components/responses/Timeout"}
    put:
      operationId: files_write
      tags: [required]
      summary: Write a file from a byte stream
      description: >-
        Creates the file or replaces its whole content. When the parent directory is missing, the provider either creates
        every missing directory on the path, as `mkdir -p` would, and writes the file, or refuses with `not_found` and creates
        nothing; a consumer relies on neither. Success is reported only after every byte is in the file. A body shorter or longer than `Content-Length` fails with `invalid_request` and outcome
        `unknown`: the file may be partly written.
      parameters:
        - name: Content-Length
          in: header
          required: true
          description: The size of the body in bytes, at most `limits.file_bytes`.
          schema: {type: integer, minimum: 0}
        - name: user
          in: query
          required: false
          description: >-
            The named user who creates the file, so that the file is owned by that user. Omitted means the class's default
            user. A user the sandbox does not have is `not_found`. A class that does not claim `user_selection` with
            `files_write: true` answers `unsupported`.
          schema: {$ref: "#/components/schemas/UserName"}
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: {type: string, contentMediaType: application/octet-stream}
      responses:
        "200":
          description: Every byte is in the file.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/FileInfo"}
        "400": {$ref: "#/components/responses/InvalidRequest"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
        "413": {$ref: "#/components/responses/TooLarge"}
        "429": {$ref: "#/components/responses/RateLimited"}
        "500": {$ref: "#/components/responses/ProviderError"}
        "503": {$ref: "#/components/responses/Unavailable"}
        "504": {$ref: "#/components/responses/Timeout"}
    delete:
      operationId: files_remove
      tags: [optional]
      summary: Remove a file, a link, or a directory
      description: >-
        Directory operations (no gate; `classes[].operations`). Removes a file, a symbolic link (the link, never its
        target), an entry of type `other`, or an empty directory. A non-empty directory needs `recursive` true; without it
        the call is `conflict` and removes nothing. A recursive removal never follows a symbolic link, and its outcome is
        `unknown` when it fails part way. A missing path is `not_found`; the path `/` is `invalid_request`.
      parameters:
        - name: recursive
          in: query
          required: false
          description: True removes a non-empty directory with everything in it. Default false.
          schema: {type: boolean, default: false}
      responses:
        "200":
          description: The path is gone.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/EmptyObject"}
        "400": {$ref: "#/components/responses/InvalidRequest"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
        "422": {$ref: "#/components/responses/Unsupported"}
        "429": {$ref: "#/components/responses/RateLimited"}
        "500": {$ref: "#/components/responses/ProviderError"}
        "503": {$ref: "#/components/responses/Unavailable"}
        "504": {$ref: "#/components/responses/Timeout"}
  /v1/sandboxes/{sandbox_id}/files/exists:
    parameters:
      - {$ref: "#/components/parameters/SandboxId"}
      - {$ref: "#/components/parameters/FilePathQuery"}
    get:
      operationId: files_exists
      tags: [optional]
      summary: Whether an entry exists at a path
      description: >-
        Directory operations (no gate; `classes[].operations`). Reports `exists` true with the entry's type, or `exists`
        false with a null type, which includes a missing parent. A final symbolic link is not followed: a dangling link
        exists, with type `symlink`.
      responses:
        "200":
          description: Whether the path exists.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/PathInfo"}
        "400": {$ref: "#/components/responses/InvalidRequest"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
        "422": {$ref: "#/components/responses/Unsupported"}
        "429": {$ref: "#/components/responses/RateLimited"}
        "500": {$ref: "#/components/responses/ProviderError"}
        "503": {$ref: "#/components/responses/Unavailable"}
        "504": {$ref: "#/components/responses/Timeout"}
  /v1/sandboxes/{sandbox_id}/directories:
    parameters:
      - {$ref: "#/components/parameters/SandboxId"}
    get:
      operationId: files_list
      tags: [optional]
      summary: List the entries of a directory
      description: >-
        Directory operations (no gate; `classes[].operations`). Returns the immediate entries of the directory at `path`,
        without `.` and `..`, sorted by the bytes of their names. A symbolic link inside the directory is never followed:
        its type is `symlink`. A missing path is `not_found`; a path that is not a directory is `invalid_request`.
      parameters:
        - {$ref: "#/components/parameters/FilePathQuery"}
        - name: cursor
          in: query
          required: false
          description: The `next_cursor` of the page before. Opaque.
          schema: {type: string, minLength: 1}
        - name: limit
          in: query
          required: false
          description: 1 to `limits.list_limit`; default 100.
          schema: {type: integer, minimum: 1, default: 100}
      responses:
        "200":
          description: One page of entries, in name order.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/DirectoryPage"}
        "400": {$ref: "#/components/responses/InvalidRequest"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
        "422": {$ref: "#/components/responses/Unsupported"}
        "429": {$ref: "#/components/responses/RateLimited"}
        "500": {$ref: "#/components/responses/ProviderError"}
        "503": {$ref: "#/components/responses/Unavailable"}
        "504": {$ref: "#/components/responses/Timeout"}
    post:
      operationId: files_mkdir
      tags: [optional]
      summary: Create a directory
      description: >-
        Directory operations (no gate; `classes[].operations`). Creates a directory owned by the default user; with
        `parents` true it also creates every missing ancestor, as `mkdir -p` does. An existing directory at the path is
        success. A missing parent without `parents` is `not_found`. An entry that is not a directory, at the path or at an
        ancestor that `parents` would create, is `conflict`.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/MkdirRequest"}
      responses:
        "200":
          description: The directory exists.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/EmptyObject"}
        "400": {$ref: "#/components/responses/InvalidRequest"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
        "422": {$ref: "#/components/responses/Unsupported"}
        "429": {$ref: "#/components/responses/RateLimited"}
        "500": {$ref: "#/components/responses/ProviderError"}
        "503": {$ref: "#/components/responses/Unavailable"}
        "504": {$ref: "#/components/responses/Timeout"}
  /v1/sandboxes/{sandbox_id}/processes:
    parameters:
      - {$ref: "#/components/parameters/SandboxId"}
    post:
      operationId: process_start
      tags: [required]
      summary: Start a background process
      description: >-
        Returns at once. The process keeps running after the call returns and while nobody reads its output.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ProcessStartRequest"}
      responses:
        "200":
          description: The process started.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Process"}
        "400": {$ref: "#/components/responses/InvalidRequest"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
        "422": {$ref: "#/components/responses/Unsupported"}
        "429": {$ref: "#/components/responses/RateLimited"}
        "500": {$ref: "#/components/responses/ProviderError"}
        "503": {$ref: "#/components/responses/Unavailable"}
        "504": {$ref: "#/components/responses/Timeout"}
  /v1/sandboxes/{sandbox_id}/processes/{process_id}/output:
    parameters:
      - {$ref: "#/components/parameters/SandboxId"}
      - {$ref: "#/components/parameters/ProcessId"}
    get:
      operationId: process_output
      tags: [required]
      summary: Read a process's output and exit status
      description: >-
        Closing stdout and stderr does not mean that the process exited: only `state: exited` with an `exit_code` means that.
        The provider keeps at least `limits.process_output_bytes` of the newest output per stream, and the record for at
        least `limits.process_retention_seconds` after exit; after that the answer is `not_found`.
      parameters:
        - name: cursor
          in: query
          required: false
          description: The `next_cursor` of the previous call. Without it, reading starts at the oldest output still kept.
          schema: {type: string, minLength: 1}
        - name: wait_ms
          in: query
          required: false
          description: >-
            Holds the call until new output arrives, the process exits or the time passes, whichever is first.
            0 to `limits.wait_ms`.
          schema: {type: integer, minimum: 0, default: 0}
      responses:
        "200":
          description: New output since the cursor.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/OutputPage"}
        "400": {$ref: "#/components/responses/InvalidRequest"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "429": {$ref: "#/components/responses/RateLimited"}
        "500": {$ref: "#/components/responses/ProviderError"}
        "503": {$ref: "#/components/responses/Unavailable"}
        "504": {$ref: "#/components/responses/Timeout"}
  /v1/sandboxes/{sandbox_id}/cost:
    parameters:
      - {$ref: "#/components/parameters/SandboxId"}
    get:
      operationId: cost
      tags: [optional]
      summary: The sandbox's cost
      description: >-
        Offered when discovery states `limits.cost_final_within_seconds`; without it the answer is `unsupported`. Works in
        every state, including after the sandbox ends. While the sandbox exists the status is `accruing`. The cost reaches
        `final` within `limits.cost_final_within_seconds` after the sandbox ends and stays readable at least until it is
        `final`. A class that lists `cost.capture` is exempt from the readable-after-the-end rule.
      parameters:
        - name: created_at
          in: query
          required: false
          description: >-
            A lookup hint: when the caller knows the sandbox was created (the `created_at` that `create` or `get` returned).
            A provider whose usage records are kept by time may use it to bound where it looks for them, and **must not**
            report a cost from before it. A provider that knows the time itself ignores it. A provider that needs the time
            and gets none answers with its own error.
          schema: {$ref: "#/components/schemas/Timestamp"}
      responses:
        "200":
          description: The cost so far, or the final cost.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Cost"}
        "400": {$ref: "#/components/responses/InvalidRequest"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "422": {$ref: "#/components/responses/Unsupported"}
        "429": {$ref: "#/components/responses/RateLimited"}
        "500": {$ref: "#/components/responses/ProviderError"}
        "503": {$ref: "#/components/responses/Unavailable"}
        "504": {$ref: "#/components/responses/Timeout"}
  /v1/sandboxes/{sandbox_id}/cost/capture:
    parameters:
      - {$ref: "#/components/parameters/SandboxId"}
    post:
      operationId: cost_capture
      tags: [optional]
      summary: Fix the sandbox's cost before it is destroyed (idempotent)
      description: >-
        Offered when a class lists `cost.capture` in `operations`. For a provider whose usage records go with the sandbox:
