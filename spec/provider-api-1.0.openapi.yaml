              schema: {$ref: "#/components/schemas/PreparedImage"}
        "400": {$ref: "#/components/responses/InvalidRequest"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "422": {$ref: "#/components/responses/Unsupported"}
        "429": {$ref: "#/components/responses/RateLimited"}
        "500": {$ref: "#/components/responses/ProviderError"}
        "503": {$ref: "#/components/responses/Unavailable"}
        "504": {$ref: "#/components/responses/Timeout"}
    delete:
      operationId: image_delete
      tags: [optional]
      summary: Delete a prepared image
      description: >-
        Section `images`. Returns once the provider has accepted it; afterwards `image_get` and a create from the image are
        `not_found`. A repeated delete succeeds with state `deleted`. A sandbox already created from it is not affected.
      responses:
        "200":
          description: The delete was accepted.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ImageDeleteResult"}
        "400": {$ref: "#/components/responses/InvalidRequest"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
        "422": {$ref: "#/components/responses/Unsupported"}
        "429": {$ref: "#/components/responses/RateLimited"}
        "500": {$ref: "#/components/responses/ProviderError"}
        "503": {$ref: "#/components/responses/Unavailable"}
        "504": {$ref: "#/components/responses/Timeout"}
  /v1/cost:
    get:
      operationId: account_cost
      tags: [optional]
      summary: The account's cost over a window
      description: >-
        What the whole account was charged for the window from `start` up to `end`, as the provider's own account records
        state it. A billing true-up compares it with the sum of the sandbox costs. Offered when discovery states
        `limits.account_cost_window_seconds`, the longest window that the provider answers; without it the answer is
        `unsupported`. A window that is empty, reversed or longer than that limit is `invalid_request`. The cost needs no
        sandbox: it covers every charge on the account in the window, including charges for sandboxes that are gone.
      parameters:
        - name: start
          in: query
          required: true
          description: The start of the window, inclusive.
          schema: {$ref: "#/components/schemas/Timestamp"}
        - name: end
          in: query
          required: true
          description: The end of the window, exclusive. It is after `start`.
          schema: {$ref: "#/components/schemas/Timestamp"}
      responses:
        "200":
          description: The account's cost for the window.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/AccountCost"}
        "400": {$ref: "#/components/responses/InvalidRequest"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
  /v1/images/{image_id}/cost:
    parameters:
      - {$ref: "#/components/parameters/ImageId"}
    get:
      operationId: image_cost
      tags: [optional]
      summary: What preparing the image cost
      description: >-
        Claimed by listing `image.cost` in `classes[].operations`, together with `image.prepare`; without it the answer is
        `unsupported`. The lines are what the provider charged to prepare the image, for a `ready` image and for a `failed`
        one (the work that ran before it failed is billed). `image_id` is set and `sandbox_id` is absent. The status is
        `final` once the preparation has ended and the provider's records will not change. The cost stays readable after the
        image is deleted, at least until it is `final`.
      parameters:
        - name: created_at
          in: query
          required: false
          schema: {$ref: "#/components/schemas/Timestamp"}
          description: >-
            A lookup hint: the time the caller started the preparation. A provider whose usage records are kept by time may use
            it to bound where it looks, must not report a cost from before it, and ignores it when it knows the time itself.
      responses:
        "200":
          description: The cost so far, or the final cost.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Cost"}
        "400": {$ref: "#/components/responses/InvalidRequest"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "422": {$ref: "#/components/responses/Unsupported"}
        "429": {$ref: "#/components/responses/RateLimited"}
        "500": {$ref: "#/components/responses/ProviderError"}
        "503": {$ref: "#/components/responses/Unavailable"}
        "504": {$ref: "#/components/responses/Timeout"}
  /v1/sandboxes/{sandbox_id}/terminals:
    parameters:
      - {$ref: "#/components/parameters/SandboxId"}
    post:
      operationId: terminal_open
      tags: [optional]
      summary: A single-use WebSocket link to a terminal in the sandbox
      description: >-
        Section `terminal`. Checks the sandbox and the fields and starts nothing: the program starts when the returned link
        is connected. The WebSocket messages are in `provider-api.md` section 16.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/TerminalRequest"}
      responses:
        "200":
          description: The terminal link.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/TerminalLink"}
        "400": {$ref: "#/components/responses/InvalidRequest"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
        "422": {$ref: "#/components/responses/Unsupported"}
        "429": {$ref: "#/components/responses/RateLimited"}
        "500": {$ref: "#/components/responses/ProviderError"}
        "503": {$ref: "#/components/responses/Unavailable"}
        "504": {$ref: "#/components/responses/Timeout"}
  /v1/sandboxes/{sandbox_id}/terminals/{terminal_id}/link:
    parameters:
      - {$ref: "#/components/parameters/SandboxId"}
      - {$ref: "#/components/parameters/TerminalId"}
    post:
      operationId: terminal_reattach
      tags: [optional]
      summary: A single-use WebSocket link to a terminal that was opened under an id
      description: >-
        Section `terminal` with the knob `reattach`. Starts nothing: connecting the returned link attaches to the running
        terminal that `terminal_open` started under this `id`, and any earlier connection to it is closed. The link rules and
        messages are those of `terminal_open` (`provider-api.md` section 16). A terminal that is not running (it exited, was
        ended, or never existed) is a `not_found` error message when the link is connected.
      requestBody:
        required: false
        content:
          application/json:
            schema: {$ref: "#/components/schemas/EmptyObject"}
      responses:
        "200":
          description: The terminal link.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/TerminalLink"}
        "400": {$ref: "#/components/responses/InvalidRequest"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
        "422": {$ref: "#/components/responses/Unsupported"}
        "429": {$ref: "#/components/responses/RateLimited"}
        "500": {$ref: "#/components/responses/ProviderError"}
        "503": {$ref: "#/components/responses/Unavailable"}
        "504": {$ref: "#/components/responses/Timeout"}
  /v1/sandboxes/{sandbox_id}/terminals/{terminal_id}:
    parameters:
      - {$ref: "#/components/parameters/SandboxId"}
      - {$ref: "#/components/parameters/TerminalId"}
    delete:
      operationId: terminal_end
      tags: [optional]
      summary: End a terminal that was opened under an id
      description: >-
        Section `terminal` with the knob `reattach`. Ends the terminal as a closed connection ends one that has no id
        (`provider-api/terminal-close-ends`). An id that is already gone succeeds.
      responses:
        "200":
          description: The terminal is ended.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/EmptyObject"}
        "400": {$ref: "#/components/responses/InvalidRequest"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
        "422": {$ref: "#/components/responses/Unsupported"}
        "429": {$ref: "#/components/responses/RateLimited"}
        "500": {$ref: "#/components/responses/ProviderError"}
        "503": {$ref: "#/components/responses/Unavailable"}
        "504": {$ref: "#/components/responses/Timeout"}
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: >-
        The provider account's own API token, as the provider issues it. It is the only credential: a request never carries a
        second secret, and no field names an account.
  x-sps-errors:
    invalid_request:
      status: 400
      x-sps-fault: caller
    unauthenticated:
      status: 401
      x-sps-fault: caller
    forbidden:
      status: 403
      x-sps-fault: caller
    not_found:
      status: 404
      x-sps-fault: caller
    conflict:
      status: 409
      x-sps-fault: caller
    too_large:
      status: 413
      x-sps-fault: caller
    unsupported:
      status: 422
      x-sps-fault: caller
    quota_exceeded:
      status: 402
      x-sps-fault: caller
    rate_limited:
      status: 429
      x-sps-fault: caller
    unavailable:
      status: 503
      x-sps-fault: provider
    timeout:
      status: 504
      x-sps-fault: provider
    provider_error:
      status: 500
      x-sps-fault: provider
  headers:
    RequestId:
      description: An id that the provider's support staff can look up. A provider should send it.
      schema: {type: string}
    RetryAfter:
      description: The same value as `retry_after_seconds` of the error, set when retrying later can work.
      schema: {type: integer, minimum: 0}
  parameters:
    SandboxId:
      name: sandbox_id
      in: path
      required: true
      description: The sandbox id that the provider chose.
      schema: {type: string, pattern: "^[A-Za-z0-9._:-]{1,128}$"}
    PreviewId:
      name: preview_id
      in: path
      required: true
      description: The preview id that `preview_link` returned.
      schema: {type: string, pattern: "^[A-Za-z0-9._:-]{1,128}$"}
    TerminalId:
      name: terminal_id
      in: path
      required: true
      description: The `id` that `terminal_open` was given.
      schema: {$ref: "#/components/schemas/TerminalId"}
    SnapshotId:
      name: snapshot_id
      in: path
      required: true
      description: The snapshot id that the provider chose.
      schema: {type: string, pattern: "^[A-Za-z0-9._:-]{1,128}$"}
    ImageId:
      name: image_id
      in: path
      required: true
      description: The prepared image id that the provider chose.
      schema: {type: string, pattern: "^[A-Za-z0-9._:-]{1,128}$"}
    ProcessId:
      name: process_id
      in: path
      required: true
      description: The process id that the provider chose.
      schema: {type: string, pattern: "^[A-Za-z0-9._:-]{1,128}$"}
    FilePathQuery:
      name: path
      in: query
      required: true
      description: An absolute path in the filesystem that commands see.
      schema: {$ref: "#/components/schemas/FilePath"}
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: >-
        8 to 63 characters from `a-z 0-9 -`, starting with a letter or a digit (a UUID fits). Within 24 hours a repeated
        create with the same key never makes a second sandbox.
      schema: {type: string, pattern: "^[a-z0-9][a-z0-9-]{7,62}$"}
  responses:
    InvalidRequest:
      description: The request is malformed, has an unknown field, or has a value out of range.
      content:
        application/json:
          schema: {$ref: "#/components/schemas/ErrorResponse"}
    Unauthenticated:
      description: The token is missing, wrong or expired.
      content:
        application/json:
          schema: {$ref: "#/components/schemas/ErrorResponse"}
    QuotaExceeded:
      description: The account reached its plan, spending or concurrency limit.
      content:
        application/json:
          schema: {$ref: "#/components/schemas/ErrorResponse"}
    Forbidden:
      description: The token is valid but may not do this.
      content:
        application/json:
          schema: {$ref: "#/components/schemas/ErrorResponse"}
    NotFound:
      description: The sandbox, process, file or directory does not exist.
      content:
        application/json:
          schema: {$ref: "#/components/schemas/ErrorResponse"}
    Conflict:
      description: >-
        The sandbox's state forbids the operation, or an `Idempotency-Key` was reused with a different body or while its
        create is in progress.
      headers:
        Retry-After: {$ref: "#/components/headers/RetryAfter"}
      content:
        application/json:
          schema: {$ref: "#/components/schemas/ErrorResponse"}
    TooLarge:
      description: A file or body is over a declared limit.
      content:
        application/json:
          schema: {$ref: "#/components/schemas/ErrorResponse"}
    Unsupported:
      description: The request names a class, region, size, image, section or value that this provider does not offer.
      content:
        application/json:
          schema: {$ref: "#/components/schemas/ErrorResponse"}
    RateLimited:
      description: The account sent too many requests.
      headers:
        Retry-After: {$ref: "#/components/headers/RetryAfter"}
      content:
        application/json:
          schema: {$ref: "#/components/schemas/ErrorResponse"}
    Unavailable:
      description: "The provider cannot serve a valid request now: no capacity, or maintenance."
      headers:
        Retry-After: {$ref: "#/components/headers/RetryAfter"}
      content:
        application/json:
          schema: {$ref: "#/components/schemas/ErrorResponse"}
    Timeout:
      description: The provider did not finish the operation in time.
      content:
        application/json:
          schema: {$ref: "#/components/schemas/ErrorResponse"}
    ProviderError:
      description: Any other failure on the provider's side.
      content:
        application/json:
          schema: {$ref: "#/components/schemas/ErrorResponse"}
  schemas:
    Timestamp:
      type: string
      format: date-time
      pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}(\\.[0-9]+)?Z$"
      description: An RFC 3339 time in UTC with a `Z` suffix.
    Decimal:
      type: string
      pattern: "^[0-9]+(\\.[0-9]+)?$"
      description: An amount or quantity as a decimal string, such as `0.000014`; never a JSON number.
    Labels:
      type: object
      maxProperties: 32
      propertyNames: {pattern: "^[A-Za-z0-9_./-]{1,63}$"}
      additionalProperties: {type: string, maxLength: 255}
      description: >-
        At most 32 entries. A key is 1 to 63 bytes from `A-Z a-z 0-9 _ . / -`; a value is 0 to 255 bytes of UTF-8. Labels
        carry no meaning for the provider and never change what a sandbox may do.
    Env:
      type: object
      propertyNames: {pattern: "^[A-Za-z_][A-Za-z0-9_]*$"}
      additionalProperties: {type: string}
      description: >-
        Environment variables. Names and values together are at most 65536 bytes, counting 2 bytes of overhead per variable.
    UserName:
      type: string
      pattern: "^[A-Za-z0-9_][A-Za-z0-9_.-]{0,63}$"
      description: The name of an operating-system user in the sandbox.
    FilePath:
      type: string
      minLength: 1
      maxLength: 4096
      pattern: "^/[^\\u0000]*$"
      description: >-
        An absolute path of at most 4096 bytes, with no NUL byte and no component over 255 bytes. It names a path in the
        filesystem that commands see.
    Port:
      type: integer
      minimum: 1
      maximum: 65535
      description: A TCP port inside the sandbox.
    PriceItem:
      enum: [cpu, memory, disk, gpu, machine, create, egress, snapshot, volume, start, request, feature]
      description: >-
        What is charged: CPU, memory, disk, GPUs, a whole fixed-size machine, each sandbox created, traffic out of the
        sandbox, stored snapshots, persistent volumes, each start or resume, API requests, or a recurring fee for an
        enabled feature.
    PriceUnit:
      enum:
        - vcpu_second
        - vcpu_hour
        - vcpu_month
        - core_second
        - core_hour
        - gib_second
        - gib_hour
        - gib_month
        - gb_second
        - gb_hour
        - gb_month
        - gpu_second
        - gpu_hour
        - machine_second
        - machine_hour
        - gib
        - gb
        - each
        - month
      description: >-
        The unit as the provider states it. A month is 730 hours. `each` is one item, once; `month` is one item per month
        (a recurring fee, for example the `feature` item). GiB is 2^30 bytes and GB is 10^9 bytes; a provider that
        says "GB" but bills binary gigabytes writes `gib`. A `core` is a physical core.
    EmptyObject:
      type: object
      maxProperties: 0
      additionalProperties: false
      description: The body `{}`.
    Error:
      type: object
      required: [code, message, outcome]
      properties:
        code:
          enum:
            - invalid_request
            - unauthenticated
            - forbidden
            - not_found
            - conflict
            - too_large
            - unsupported
            - quota_exceeded
            - rate_limited
            - unavailable
            - timeout
            - provider_error
          description: >-
            Authoritative; the HTTP status only mirrors it. `x-sps-errors` under `components` gives each code's status and
            fault.
        message:
          type: string
          maxLength: 1024
          description: For people. It holds no credential and no response body from another system.
        outcome:
          enum: [failed, unknown]
          description: >-
            `failed`: the operation had no effect. `unknown`: it may have taken effect. Caller-fault codes have outcome
            `failed`, except `invalid_request` for a streamed file upload whose body size differs from its declared size;
            some or all bytes may have been written.
        retry_after_seconds:
          type: [integer, "null"]
          minimum: 0
          description: Set when retrying later can work; the same value goes in a `Retry-After` header.
        failed_step:
          type: integer
          minimum: 1
          description: >-
            The 1-based Dockerfile instruction whose own command failed, so the customer's build is at fault and another
            provider would fail the same way. Set on `image.prepare` errors and in `PreparedImage.error`.
        field:
          type: string
          minLength: 1
          maxLength: 64
          description: >-
            The request field at fault, for example `image`. On a `create` that answers `provider_error`, `image` means that the
            prepared image never booted.
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error: {$ref: "#/components/schemas/Error"}
      description: The body of every error response.
    Size:
      type: object
      description: One size in discovery's `resources.sizes` that a price can name.
      required: [cpu, memory_mib]
      properties:
        cpu: {type: number, exclusiveMinimum: 0, description: "Virtual CPUs."}
        memory_mib: {type: integer, minimum: 1, description: "Memory in MiB."}
    Price:
      type: object
      description: >-
        One priced item of a class. The four required fields are enough to publish a price list; the rest state the rules that
        real price lists have. An item that a class does not list has an unknown price, never a zero price.
      required: [item, price_usd, unit, basis]
      properties:
        item: {$ref: "#/components/schemas/PriceItem"}
        price_usd:
          $ref: "#/components/schemas/Decimal"
          description: The price of one `unit` in US dollars. `"0"` is allowed only together with `included` true.
        unit: {$ref: "#/components/schemas/PriceUnit"}
        basis:
          enum: [allocated, used, max_allocated_used, fixed, count]
          description: >-
            What is measured: the reserved capacity, the actual use, the larger of the two, a fixed machine size, or a count of
            events.
        included:
          type: boolean
          description: The item is included in the price of something else, or free. Requires `price_usd` `"0"`.
        states:
          type: array
          uniqueItems: true
          items: {enum: [running, paused, stopped]}
          description: >-
            The sandbox states in which a time-based item accrues. When absent, the item accrues while running and other states
            are unknown.
        increment_seconds:
          type: integer
          minimum: 1
          description: Time is billed in whole increments of this many seconds, rounded up.
        minimum_seconds:
          type: integer
          minimum: 1
          description: The least time billed per sandbox.
        minimum_quantity:
          $ref: "#/components/schemas/Decimal"
          description: The smallest quantity billed, in the unit's quantity (for example `0.125` cores).
        allowance:
          type: object
          required: [quantity, period, scope]
          properties:
            quantity: {$ref: "#/components/schemas/Decimal"}
            period: {enum: [month, sandbox]}
            scope: {enum: [account, sandbox]}
          description: A quantity included before this price applies.
        size:
          $ref: "#/components/schemas/Size"
          description: Only for this size (item `machine`).
        region: {type: string, minLength: 1, description: "Only in this region."}
        gpu_model: {type: string, minLength: 1, description: "Only for this GPU model id."}
        variant: {type: string, minLength: 1, description: "Only for this named variant of the class, such as `preemptible`."}
      allOf:
        - if:
            required: [price_usd]
            properties:
              price_usd: {pattern: "^0+(\\.0+)?$"}
          then:
            required: [included]
            properties:
              included: {const: true}
        - if:
            required: [included]
            properties:
              included: {const: true}
          then:
            properties:
              price_usd: {pattern: "^0+(\\.0+)?$"}
    Image:
      type: object
      required: [id, default, description]
      properties:
        id: {type: string, minLength: 1, description: "The image id that `create` and the Sandbox object use."}
        default: {type: boolean, description: "True for the one image that a create without an image gets."}
        description: {type: string}
      description: One of the provider's ready-made images.
    Limits:
      type: object
      description: >-
        The provider's limits. Each value except `cost_final_within_seconds` and `account_cost_window_seconds` is at least its
        floor, which every conforming provider meets. Those two are the provider's own statements, and stating one offers
        `cost` or `account.cost`.
      required:
        - file_bytes
        - run_timeout_ms
        - output_bytes
        - wait_ms
        - process_output_bytes
        - process_retention_seconds
        - list_limit
      properties:
        file_bytes: {type: integer, minimum: 1073741824, description: "Largest file that `files.read` and `files.write` accept."}
        run_timeout_ms: {type: integer, minimum: 60000, description: "Largest `timeout_ms` that `run` accepts."}
        output_bytes: {type: integer, minimum: 16777216, description: "Largest `output_limit_bytes` for `run`, per stream."}
        wait_ms: {type: integer, minimum: 30000, description: "Longest `wait_ms` that `process.output` honors."}
        process_output_bytes: {type: integer, minimum: 1048576, description: "Output kept per stream of a process, newest first."}
        process_retention_seconds:
          type: integer
          minimum: 600
          description: How long a process's record and output stay readable after it exits.
        list_limit: {type: integer, minimum: 100, description: "Largest page that `list` returns."}
        cost_final_within_seconds:
          type: integer
          minimum: 0
          description: >-
            Offers `cost`. The provider makes a sandbox's `cost` `final` within this many seconds after the sandbox ends. The
            spec sets no ceiling.
        image_context_bytes:
          type: integer
          minimum: 536870912
          description: >-
            Largest build context (the tar archive) that `image_prepare` accepts. Stated by a provider that lists the image
            operations; at least 512 MiB.
        account_cost_window_seconds:
          type: integer
          minimum: 1
          description: >-
            Offers `account.cost`. The longest window, in seconds, that `account.cost` answers. The spec sets no ceiling.
        image_layout_bytes:
          type: integer
          minimum: 1
          description: >-
            The largest OCI image layout, in bytes, that a class listing `image.prepare.oci_layout` accepts in the `context`
            part. Required when a class lists it.
        stored_artifacts_documented:
          type: integer
          minimum: 1
          description: >-
            The most prepared images and snapshots, counted together, that the provider documents for its default plan.
            Display only: a consumer never enforces it, never evicts on it and never treats it as a ceiling. The account's
            own figure is `stored_artifacts.limit` of `account.capacity`.
    ProviderInfo:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
          pattern: "^[a-z0-9-]{2,32}$"
          description: The stable provider id; the same id the adapter's `provider_id` uses.
        name: {type: string, minLength: 1, description: "The display name."}
        docs_url: {type: string, format: uri, description: "A link to the provider's documentation."}
    SandboxClass:
      type: object
      description: >-
        A wholesale different kind of sandbox, such as a container or a microVM. A declaration's `evidence` and `verified`
        fields are left out: proof comes from the tester's report, not from the provider's own document.
      required: [id, name, ready, resources, lifetime_timer, images, prices]
      dependentSchemas:
        image_binds:
          required: [operations]
          properties:
            operations: {contains: {const: image.prepare}}
      properties:
        id: {type: string, minLength: 1, description: "`default` for the main class; `create` names a class by this id."}
        name: {type: string, minLength: 1, description: "The display name."}
        ready:
          type: boolean
          description: False means do not create new sandboxes in this class now; existing sandboxes keep working.
        unavailable_regions:
          type: array
          uniqueItems: true
          items: {type: string, minLength: 1}
          description: Regions that refuse new sandboxes now.
        resources:
          $ref: "declaration-schema.json#/properties/resources"
          description: >-
            Regions, located-in countries, sizes, default size, disk, arch, maximum lifetime and the other SPS resource facts.
        lifetime_timer:
          $ref: "declaration-schema.json#/properties/lifetime_timer"
          description: How the provider ends a sandbox when its lifetime runs out.
        lifetime_enforced_by:
          enum: [provider, router]
          default: provider
          description: >-
            Who ends a sandbox in this class when its lifetime runs out. `provider` (the default) means the provider does, and
            the rule `provider-api/lifetime-enforced` applies. `router` means the caller, the router, ends it through its
            lease and sweeper; the provider still honours `destroy`, and the tester does not check the lifetime timer.
        ordered_sessions:
          type: boolean
          default: false
          description: >-
            True means that a command (`run`, `process.start`) and a session transition (`pause`, `resume`, `stop`) on one
            sandbox of this class must not overlap: the caller records a command's outcome before it sends the next
            transition, and a transition's before the next command. False (the default) means the provider serves them
            concurrently. The provider is not asked to refuse an overlap.
        memory_totals_untrusted:
          type: boolean
          default: false
          description: >-
            True means that the memory total a sandbox of this class reports about itself (what its own tools read) is not
            the memory the sandbox can use, as when a sandbox runtime shows the host's total, so the caller does not take a
            total from the sandbox. False (the default) means the total is the sandbox's own. The tester does not check it.
        gates:
          $ref: "declaration-schema.json#/properties/gates"
          description: The optional sections claimed, with their variants and knob values. A claim alone turns on nothing.
        operations:
          type: array
          uniqueItems: true
          items:
            enum:
              - files.list
              - files.mkdir
              - files.remove
              - files.exists
              - run.base64
              - image.prepare
              - image.get
              - image.list
              - image.delete
              - labels.update
              - image.prepare.oci_layout
              - image.cost
              - cost.capture
              - account.capacity
              - resume.lifetime
          allOf:
            - if: {contains: {enum: [files.list, files.mkdir, files.remove, files.exists]}}
              then:
                allOf:
                  - {contains: {const: files.list}}
                  - {contains: {const: files.mkdir}}
                  - {contains: {const: files.remove}}
                  - {contains: {const: files.exists}}
            - if: {contains: {enum: [image.prepare, image.get, image.list, image.delete]}}
              then:
                allOf:
                  - {contains: {const: image.prepare}}
                  - {contains: {const: image.get}}
                  - {contains: {const: image.list}}
                  - {contains: {const: image.delete}}
            - if: {contains: {enum: [image.prepare.oci_layout, image.cost]}}
              then: {contains: {const: image.prepare}}
          default: []
          description: >-
            Optional operations that no SPS gate covers. `files.list`, `files.mkdir`, `files.remove` and `files.exists` are
            listed all four or none, and so are the image operations `image.prepare`, `image.get`, `image.list` and
            `image.delete` (the class also claims `custom_images` knob `prepared`). `run.base64` says that `run` accepts
            `output: base64`, and `labels.update`, `cost.capture` and `account.capacity` each stand alone (they are not part of either group), and so does `resume.lifetime` (`resume` takes `lifetime_seconds` and arms that lifetime in the same call; it needs the `pause_resume` section). Two more need
            `image.prepare`: `image.cost` (`GET /v1/images/{id}/cost`) and `image.prepare.oci_layout` (an OCI image arrives as
            an image-layout tar in the `context` part, and the provider states `limits.image_layout_bytes`). They turn on when
            the tester passes them.
        images:
          type: array
          minItems: 1
          items: {$ref: "#/components/schemas/Image"}
          contains:
            type: object
            required: [default]
            properties:
              default: {const: true}
          minContains: 1
          maxContains: 1
          description: The ready-made images. Exactly one has `default` true, and it meets the baseline.
        prices:
          type: array
          items: {$ref: "#/components/schemas/Price"}
          description: >-
            The list prices of this class. A provider may state none: an empty list states no prices, which is not a price of
            zero and is not an error.
        image_binds:
          type: array
          uniqueItems: true
          items: {enum: [cpu_min, memory_min_mib, disk_min_mib, region, kernel]}
          description: >-
            What a prepared image of this class is tied to: a size (`cpu_min`, `memory_min_mib`, `disk_min_mib`), a `region` or
            a `kernel`. Present only when `operations` lists `image.prepare`; absent or empty means that the image fits any
            size. A `PreparedImage.resources` object holds exactly these fields and no other.
        image_labels_kept_by:
          enum: [provider, router]
          default: provider
          description: >-
            Who keeps the labels of a prepared image. `provider` (the default) means the provider does, and the rules
            `provider-api/image-prepare` and `provider-api/image-list` apply. `router` means the provider has nowhere to store
            them: it accepts `labels` on `image.prepare`, returns `{}` from `image.get` and `image.list`, ignores a `label`
            filter, and the caller, the router, keeps the labels itself. It means something only when `operations` lists `image.prepare`.
        snapshot_labels_kept_by:
          enum: [provider, router]
          default: provider
          description: >-
            Who keeps the labels of a snapshot, as `image_labels_kept_by` does for images. With `router` the provider also
            answers `snapshot.list` only for a given `sandbox_id`. It means something only when the class claims `snapshots`.
        snapshot_cost:
          enum: [offered, unavailable]
          default: offered
          description: >-
            Whether the class's provider reports what a snapshot costs. `offered` (the default) means `snapshot.cost` answers and
            the rule `provider-api/snapshot-cost` applies. `unavailable` means the provider has no record from which to state a
            snapshot's cost, answers `snapshot.cost` with `unsupported`, and still offers `cost` for sandboxes. It means
            something only when the class claims `snapshots`.
        image_delete_in_use:
          enum: [accepted, conflict]
          default: accepted
          description: >-
            Whether `image.delete` is accepted while a sandbox made from the image exists. `accepted` (the default) applies the
            rule `provider-api/image-delete`. `conflict` means the provider cannot remove an image that a sandbox still runs
            from: it answers `conflict` until those sandboxes have ended, and the delete is then accepted. It means something
            only when `operations` lists `image.prepare`.
    Discovery:
      type: object
      required: [spec_version, provider, limits, classes]
      allOf:
        - if:
            properties:
              classes:
                contains:
                  type: object
                  required: [operations]
                  properties:
                    operations: {contains: {const: image.prepare.oci_layout}}
          then:
            properties:
              limits: {required: [image_layout_bytes]}
        - if:
            properties:
              classes:
                contains:
                  type: object
                  required: [operations]
                  properties:
                    operations: {contains: {const: image.cost}}
          then:
            properties:
              limits: {required: [cost_final_within_seconds]}
      properties:
        spec_version:
          type: string
          pattern: "^1\\.[0-9]+$"
          description: The newest 1.x minor that this provider implements.
        provider: {$ref: "#/components/schemas/ProviderInfo"}
        limits: {$ref: "#/components/schemas/Limits"}
        classes:
          type: array
          minItems: 1
          items: {$ref: "#/components/schemas/SandboxClass"}
          description: The sandbox classes that this account can use.
      description: >-
        What this account can create, and the list prices. Two accounts may see different classes, regions and sizes; a plan
        or discount on an account never changes a price.
    SandboxSize:
      type: object
      required: [cpu, memory_mib, disk_mib]
      properties:
        cpu: {type: number, exclusiveMinimum: 0, description: "Virtual CPUs that the provider allocated."}
        memory_mib: {type: integer, minimum: 1, description: "Memory in MiB that the provider allocated."}
        disk_mib: {type: [integer, "null"], minimum: 1, description: "Disk in MiB, or null when the provider does not know it."}
      description: What the provider allocated.
    CreateRequest:
      type: object
      additionalProperties: false
      description: >-
        The body without `sandbox_class`, `env` and `labels` is an SPS request. The provider picks the first size in its
        `resources.sizes` that meets every floor, or `default_size` when the request has no floors. If no size, region, image,
        class or section meets the request it answers `unsupported` and creates nothing.
      properties:
        sandbox_class: {type: string, minLength: 1, default: default, description: "A class id from discovery."}
        resources:
          $ref: "request-schema.json#/$defs/resources"
          description: "Floors and pins: `cpu_min`, `memory_min_mib`, `disk_min_mib`, `region`, `arch` and the other SPS asks."
        requirements:
          $ref: "request-schema.json#/$defs/requirements"
          description: The optional sections this sandbox needs, with knob values and settings.
        image:
          $ref: "request-schema.json#/$defs/image"
          description: A custom image (needs the `custom_images` section). Absent means the class's default image.
        lifetime_seconds:
          type: [integer, "null"]
          minimum: 1
          default: 300
          description: >-
            How long the sandbox may run. The provider ends it in the `at_end` state no later than this many seconds after
            `create` returns, even if the consumer has gone away. Null asks for no lifetime; a provider that cannot run a
            sandbox without one answers `unsupported`.
        at_end:
          enum: [destroyed, paused]
          default: destroyed
          description: The state the lifetime ends in. `paused` needs the `pause_resume` section.
        env:
          $ref: "#/components/schemas/Env"
          description: Environment variables for every command and process in the sandbox.
        labels:
          $ref: "#/components/schemas/Labels"
          description: Labels, returned exactly by `get` and `list`.
        snapshot:
          type: string
          pattern: "^[A-Za-z0-9._:-]{1,128}$"
          description: >-
            Restore: start the new sandbox from this snapshot (needs the `snapshots` section). `image` must be absent or null.
            The labels of the saved sandbox are not copied.
        secrets:
          type: array
          minItems: 1
          maxItems: 64
          items: {$ref: "#/components/schemas/Secret"}
          description: >-
            Credentials that the provider adds to the sandbox's outgoing requests without code in the sandbox being able to
            read them (needs the `hidden_secrets` section: `requirements` names it, or the request is `invalid_request`).
            Write-only: no response, log line or error body carries a `value`, and a provider **must not** return one. Code in
            the sandbox sees only each `placeholder`.
      allOf:
        - if:
            required: [secrets]
          then:
            required: [requirements]
            properties:
              requirements: {required: [hidden_secrets]}
        - if:
            required: [lifetime_seconds]
            properties:
              lifetime_seconds: {type: "null"}
          then:
            not: {required: [at_end]}
    Secret:
      type: object
      additionalProperties: false
      required: [placeholder, value, hosts]
      properties:
        placeholder:
          type: string
          minLength: 1
          maxLength: 256
          description: "The text that code in the sandbox sees and may put where the credential belongs."
        value:
          type: string
          minLength: 1
          description: "The credential. Write-only: it is never returned, logged or put in an error."
        hosts:
          type: array
          minItems: 1
          uniqueItems: true
          items: {type: string, minLength: 1, maxLength: 253}
          description: >-
            The host names whose requests receive the credential, in the syntax of the `inject_into` setting. The provider adds
            the credential to requests for these hosts and no others.
        headers:
          type: array
          minItems: 1
          description: >-
            The request headers that carry the credential (needs the `header_templates` knob; `hosts` are then exact host
            names). Each is set to `prefix`, then the value, then `suffix`. Absent: the provider's default way of carrying it.
          items:
            type: object
            additionalProperties: false
            required: [name]
            properties:
              name: {type: string, pattern: "^[!#$%&'*+.^_`|~0-9A-Za-z-]+$", description: "An HTTP header name."}
              prefix: {type: string, default: "", description: "Text before the value."}
              suffix: {type: string, default: "", description: "Text after the value."}
      description: One write-only credential of a create.
    ProviderTime:
      type: object
      additionalProperties: false
      required: [kind, at, source]
      properties:
        kind:
          enum:
            [created, started, ready, paused, resumed, stopped, ended, deadline, billed_start, billed_end, requested, stop_requested, updated, checkpointed]
          description: What the time is.
        at: {$ref: "#/components/schemas/Timestamp"}
        source: {type: string, minLength: 1, description: "The provider's own name for the field that held the time."}
      description: One time that the provider reports about a sandbox, under its own field name.
    Sandbox:
      type: object
      required: [id, sandbox_class, state, size, region, image, labels, created_at, ends_at, at_end]
      properties:
        id:
          type: string
          pattern: "^[A-Za-z0-9._:-]{1,128}$"
          description: The sandbox id. It names one sandbox for as long as the provider keeps any record of it.
        sandbox_class: {type: string, minLength: 1, description: "Its class."}
        state:
          enum: [running, paused, stopped, destroyed]
          description: The SPS sandbox states.
        size: {$ref: "#/components/schemas/SandboxSize"}
        region: {type: [string, "null"], description: "The region it runs in, when the provider knows it."}
        image: {type: [string, "null"], description: "The image id from discovery, or null for a custom image."}
        labels: {$ref: "#/components/schemas/Labels"}
        created_at: {$ref: "#/components/schemas/Timestamp"}
        ends_at:
          anyOf: [{$ref: "#/components/schemas/Timestamp"}, {type: "null"}]
          description: >-
            When the lifetime timer will end it. null: not stated by this answer; read it with get. In get's own
            answer, null means the sandbox has no lifetime.
        at_end:
          enum: [destroyed, paused, null]
          description: The state the timer ends it in; null with no lifetime.
        times:
          type: array
          items: {$ref: "#/components/schemas/ProviderTime"}
          description: >-
            Times that the provider's own records state for the sandbox, each under the provider's own field name. A cost
            read places the provider's bill against them. `get` returns them when the provider keeps any; `list` may omit
            them. Absent means that the provider reports none.
      description: Returned by `create`, `get`, `list`, `pause`, `resume` and `lifetime.extend`.
    SandboxPage:
      type: object
      required: [sandboxes, next_cursor]
      properties:
        sandboxes:
          type: array
          items: {$ref: "#/components/schemas/Sandbox"}
        next_cursor:
          type: [string, "null"]
          description: Opaque. Null means that this page is the last one.
    Cost:
      type: object
      required: [status, total_usd, source, lines, as_of]
      anyOf:
        - required: [sandbox_id]
        - required: [image_id]
      properties:
        sandbox_id:
          type: string
          pattern: "^[A-Za-z0-9._:-]{1,128}$"
          description: The sandbox. Absent only for an image's cost, which sets `image_id` instead.
        status:
          enum: [accruing, final]
          description: >-
            `final` means that the figures will not change: a `final` cost has no open line, and has a `total_usd` unless
            its `source` is `usage`.
        total_usd:
          anyOf: [{$ref: "#/components/schemas/Decimal"}, {type: "null"}]
          description: >-
            The sum of the line amounts, in US dollars at the provider's published list price when the usage happened, before
            any plan, free tier, trial, credit or discount. Null only while the status is `accruing` and nothing is metered
            yet; `"0"` is a true zero. Always null when `source` is `usage`: the provider states no amount.
        source:
          enum: [reported, calculated, usage]
          description: >-
            `reported`: the provider's own records state the amounts, at list price. `calculated`: each quantity comes from the
            provider's own usage records and is multiplied by the provider's published price. A source that states net
            amounts is turned into list amounts from its quantities and is then `calculated`. `usage`: each line states a
            quantity and a unit from the provider's own usage records and no amount (`amount_usd` null, `total_usd` null); the
            consumer prices the quantities. `calculated` stays valid.
        lines:
          type: array
          items: {$ref: "#/components/schemas/CostLine"}
          description: >-
            Empty while the status is `accruing` and nothing is metered yet.
        as_of:
          $ref: "#/components/schemas/Timestamp"
          description: >-
            The time up to which these figures count usage. It may be earlier than the time of the read, for records that lag.
        snapshot_id:
          type: string
          pattern: "^[A-Za-z0-9._:-]{1,128}$"
          description: >-
            Set by `snapshot_cost` only: the snapshot whose own charges these are. `sandbox_id` is then the saved sandbox.
        image_id:
          type: string
          pattern: "^[A-Za-z0-9._:-]{1,128}$"
          description: >-
            Set by `image_cost` only: the prepared image whose preparation these charges are. There is no `sandbox_id`.
      description: >-
        The sandbox's cost. Quantities come from the provider's own records of the sandbox, never from a clock in the consumer
        or in an adapter. "The sandbox ends" is when `get` reports it `destroyed` or it is gone.
    AccountCapacity:
      type: object
      required: [as_of, starts, can_start, paid_overage_enabled, concurrency, prepaid]
      additionalProperties: false
      properties:
        as_of:
          $ref: "#/components/schemas/Timestamp"
          description: The time that these figures describe.
        starts:
          type: array
          items: {$ref: "#/components/schemas/StartWindow"}
          description: How many sandbox starts each limited window allows. Empty when the provider limits no starts.
        can_start:
          type: [boolean, "null"]
          description: Whether the account may start a sandbox now. Null when unknown.
        paid_overage_enabled:
          type: [boolean, "null"]
          description: Whether starts beyond a window's limit are allowed and charged. Null when unknown.
        concurrency:
          anyOf: [{$ref: "#/components/schemas/Concurrency"}, {type: "null"}]
          description: The account's running sandboxes against its cap. Null when unknown.
        prepaid:
          anyOf: [{$ref: "#/components/schemas/Prepaid"}, {type: "null"}]
          description: The account's prepaid balance. Null when unknown or when the account has none.
        stored_artifacts:
          anyOf: [{$ref: "#/components/schemas/StoredArtifacts"}, {type: "null"}]
          description: >-
            The prepared images and snapshots, counted together, that the account holds and may hold. Optional: absent or
            null when the provider does not report it.
      description: >-
        What the account may still do, as one read. A null field means unknown; it is never a zero or a guess.
    StoredArtifacts:
      type: object
      required: [used, limit]
      additionalProperties: false
      properties:
        used:
          type: [integer, "null"]
          minimum: 0
          description: Prepared images and snapshots, counted together, that the account holds. Null when not reported.
        limit:
          type: [integer, "null"]
          minimum: 0
          description: The most that the account may hold at once. Null when not reported.
    StartWindow:
      type: object
      required: [window_seconds, used, limit, remaining]
      additionalProperties: false
      properties:
        window_seconds: {type: integer, minimum: 1, description: The length of the window, in seconds.}
        used: {type: integer, minimum: 0, description: Starts counted in the window so far.}
        limit: {type: integer, minimum: 0, description: Starts that the window allows.}
        remaining: {type: integer, minimum: 0, description: Starts left in the window.}
    Concurrency:
      type: object
      required: [active, limit]
      additionalProperties: false
      properties:
        active: {type: integer, minimum: 0, description: Sandboxes that count against the cap now.}
        limit: {type: integer, minimum: 0, description: The most sandboxes that may count at once.}
    Prepaid:
      type: object
      required: [balance_usd, past_due]
      additionalProperties: false
      properties:
        balance_usd:
          $ref: "#/components/schemas/Decimal"
          description: The prepaid balance, in US dollars.
        past_due: {type: boolean, description: Whether the account owes a payment that the provider has not received.}
    CostLine:
      type: object
      required: [item, amount_usd]
      properties:
        item: {$ref: "#/components/schemas/PriceItem"}
        quantity:
          $ref: "#/components/schemas/Decimal"
          description: "The quantity that the amount was priced from, or that the line reports, in `unit`. Required when the cost's `source` is `calculated` or `usage`."
        unit:
          $ref: "#/components/schemas/PriceUnit"
          description: "The unit of `quantity`. Required when the cost's `source` is `calculated` or `usage`."
        amount_usd:
          anyOf: [{$ref: "#/components/schemas/Decimal"}, {type: "null"}]
          description: "The amount in US dollars. Null exactly when the cost's `source` is `usage`."
        start:
          anyOf: [{$ref: "#/components/schemas/Timestamp"}, {type: "null"}]
          description: >-
            The start of the period that the line covers. It may be a billing period (such as an hour) that contains the usage.
            With `end` null it is an open period, which runs up to `as_of`.
        end:
          anyOf: [{$ref: "#/components/schemas/Timestamp"}, {type: "null"}]
          description: >-
            The end of the period. Both `start` and `end` null: the line covers no period, as a fee does. `start` set and `end`
            null: an open period, allowed only while the status is `accruing`.
    AccountCost:
      type: object
      required: [start, end, status, total_usd, source, lines, as_of]
      properties:
        start: {$ref: "#/components/schemas/Timestamp"}
        end: {$ref: "#/components/schemas/Timestamp"}
        status:
          enum: [accruing, final]
          description: >-
            `final` means that the figures will not change. A window that reaches into the provider's open billing period is
            `accruing`.
        total_usd:
          anyOf: [{$ref: "#/components/schemas/Decimal"}, {type: "null"}]
          description: >-
            The sum of the line amounts, in US dollars at the provider's published list price, before any plan, free tier,
            trial, credit or discount. Null while the status is `accruing` and nothing is metered yet, and always null when
            the `source` is `usage`.
        source:
          enum: [reported, calculated, usage]
          description: As for `Cost`.
        lines:
          type: array
          items: {$ref: "#/components/schemas/CostLine"}
        as_of:
          $ref: "#/components/schemas/Timestamp"
          description: The time up to which these figures count usage. It may be earlier than the time of the read.
      description: >-
        What the account was charged between `start` and `end`. Each line has an `item` and an `amount_usd`, and a
        `quantity` and `unit` when the `source` is `calculated` or `usage`. A `usage` account cost states quantities from the
        provider's own records and no amounts, as a `usage` sandbox `Cost` does.
    DestroyResult:
      type: object
      required: [sandbox_id, state]
      properties:
        sandbox_id: {type: string, pattern: "^[A-Za-z0-9._:-]{1,128}$"}
        state: {enum: [destroying, destroyed]}
    SnapshotRequest:
      type: object
      additionalProperties: false
      properties:
        keeps:
          enum: [files_only, files_and_memory, null]
          default: null
          description: >-
            What to capture. Null means the `keeps` of the variant the sandbox was created with; a value that no claimed
            variant offers is `unsupported`.
        labels:
          $ref: "#/components/schemas/Labels"
          description: The snapshot's labels.
    Snapshot:
      type: object
      required: [id, sandbox_id, sandbox_class, state, keeps, size, stored_bytes, labels, created_at, expires_at]
      properties:
        id:
          type: string
          pattern: "^[A-Za-z0-9._:-]{1,128}$"
          description: The snapshot id, chosen by the provider and never reused.
        sandbox_id:
          type: string
          pattern: "^[A-Za-z0-9._:-]{1,128}$"
          description: The sandbox it was taken from.
        sandbox_class: {type: string, minLength: 1, description: "That sandbox's class; a restore creates a sandbox of this class."}
        state:
          enum: [saving, ready, failed]
          description: "`ready`: restorable. `saving`: not yet. `failed`: never will be."
        keeps:
          enum: [files_only, files_and_memory]
          description: What it captured.
        size: {$ref: "#/components/schemas/SandboxSize"}
        stored_bytes:
          type: [integer, "null"]
          minimum: 0
          description: The bytes the provider stores for it, when the provider knows.
        labels: {$ref: "#/components/schemas/Labels"}
        created_at: {$ref: "#/components/schemas/Timestamp", description: "The capture moment."}
        expires_at:
          anyOf: [{$ref: "#/components/schemas/Timestamp"}, {type: "null"}]
          description: When it stops being restorable; null means until it is deleted.
      description: Returned by `snapshot_create`, `snapshot_get` and `snapshot_list`.
    SnapshotPage:
      type: object
      required: [snapshots, next_cursor]
      properties:
        snapshots:
          type: array
          items: {$ref: "#/components/schemas/Snapshot"}
        next_cursor:
          type: [string, "null"]
          description: Opaque. Null means that this page is the last one.
    SnapshotDeleteResult:
      type: object
      required: [snapshot_id, state]
      properties:
        snapshot_id: {type: string, pattern: "^[A-Za-z0-9._:-]{1,128}$"}
        state: {enum: [deleting, deleted]}
    ImageConfig:
      type: object
      additionalProperties: false
      description: >-
        The image's own settings, resolved by the caller from the registry. The provider applies them as the defaults of a
        sandbox made from the image, and reaches no registry.
      properties:
        env: {$ref: "#/components/schemas/Env"}
        workdir:
          anyOf: [{$ref: "#/components/schemas/FilePath"}, {type: "null"}]
          default: null
        user: {type: [string, "null"], default: null, description: "A user name or numeric id."}
        entrypoint:
          anyOf: [{type: array, items: {type: string}, maxItems: 1024}, {type: "null"}]
          default: null
        cmd:
          anyOf: [{type: array, items: {type: string}, maxItems: 1024}, {type: "null"}]
          default: null
        init:
          type: [boolean, "null"]
          default: null
          description: >-
            True when the image's CMD starts a machine init (systemd or similar) as process 1. The caller resolves it from the
            image; the provider never reads the image to find out. Absent or null: not known.
        user_name:
          type: [string, "null"]
          default: null
          description: >-
            The name of the numeric `user`, resolved by the caller from the image's `/etc/passwd`. Absent or null: `user` is
            a name already, or the caller could not resolve it.
        home:
          anyOf: [{$ref: "#/components/schemas/FilePath"}, {type: "null"}]
          default: null
          description: >-
            The home directory of `user`, resolved by the caller from the image. Absent or null means that it is not known.
    ImageRequest:
      type: object
      additionalProperties: false
      required: [source]
      description: The part `request` of `image_prepare`.
      properties:
        source:
          description: >-
            Exactly one of: a public OCI image, a private OCI image (the credentials are write-only: never returned, never
            logged), or a Dockerfile (its text; the build context is the part `context`).
          oneOf:
            - type: object
              additionalProperties: false
              required: [oci, digest, config]
              properties:
                oci: {type: string, minLength: 1, maxLength: 1024, description: "The image reference."}
                digest: {$ref: "#/components/schemas/ImageDigest"}
                config: {$ref: "#/components/schemas/ImageConfig"}
            - type: object
              additionalProperties: false
              required: [private_oci, digest, config, credentials]
              properties:
                private_oci: {type: string, minLength: 1, maxLength: 1024, description: "The image reference."}
                digest: {$ref: "#/components/schemas/ImageDigest"}
                config: {$ref: "#/components/schemas/ImageConfig"}
                credentials:
                  type: object
                  additionalProperties: false
                  required: [username, password]
                  properties:
                    username: {type: string}
                    password: {type: string}
                  description: Registry credentials. Write-only.
            - type: object
              additionalProperties: false
              required: [dockerfile]
              properties:
                dockerfile: {type: string, minLength: 1, maxLength: 1048576, description: "The Dockerfile text."}
                base:
                  type: object
                  additionalProperties: false
                  required: [oci, digest, config]
                  description: >-
                    The caller's resolution of the Dockerfile's single `FROM` image, so that the provider reaches no registry to
                    read it. Absent when the caller did not resolve it.
                  properties:
                    oci: {type: string, minLength: 1, maxLength: 1024, description: "The FROM image reference."}
                    digest: {$ref: "#/components/schemas/ImageDigest"}
                    config: {$ref: "#/components/schemas/ImageConfig"}
        resources:
          anyOf: [{$ref: "#/components/schemas/ImageResources"}, {type: "null"}]
          default: null
          description: The size that a sandbox made from the image must start with; null means any size.
        labels:
          $ref: "#/components/schemas/Labels"
          description: The image's labels.
    ImageDigest:
      type: string
      pattern: "^sha256:[0-9a-f]{64}$"
      description: The image's content digest, resolved by the caller.
    ImageResources:
      type: object
      additionalProperties: false
      properties:
        cpu: {type: number, exclusiveMinimum: 0}
        memory_mib: {type: integer, minimum: 1}
        disk_mib: {type: integer, minimum: 1}
        region: {type: string, minLength: 1}
        kernel: {type: string, minLength: 1}
      description: >-
        What a prepared image is tied to. A field that is absent is not bound. In a class's `image_binds`, `cpu_min` names
        `cpu`, `memory_min_mib` names `memory_mib` and `disk_min_mib` names `disk_mib`; `region` and `kernel` name
        themselves.
    PreparedImage:
      type: object
      required: [id, state, error, resources, stored_bytes, labels, created_at]
      description: Returned by `image_prepare`, `image_get` and `image_list`.
      properties:
        id:
          type: string
          pattern: "^[A-Za-z0-9._:-]{1,128}$"
          description: >-
            The image id, chosen by the provider and never reused. `create` takes it as `image: {provider_artifact: <id>}`.
        state:
          enum: [preparing, ready, failed]
          description: "`ready`: a sandbox can start from it. `preparing`: not yet. `failed`: never will be."
        error:
          anyOf: [{$ref: "#/components/schemas/Error"}, {type: "null"}]
          description: Why it failed, when the state is `failed`; null otherwise.
        resources:
          anyOf: [{$ref: "#/components/schemas/ImageResources"}, {type: "null"}]
          description: The size that the image is bound to, or null when a sandbox of any size can start from it.
        stored_bytes:
          type: [integer, "null"]
          minimum: 0
          description: The bytes the provider stores for it, when the provider knows.
        labels: {$ref: "#/components/schemas/Labels"}
        created_at: {$ref: "#/components/schemas/Timestamp"}
    ImagePage:
      type: object
      required: [images, next_cursor]
      properties:
        images:
          type: array
          items: {$ref: "#/components/schemas/PreparedImage"}
        next_cursor:
          type: [string, "null"]
          description: Opaque. Null means that this page is the last one.
    ImageDeleteResult:
      type: object
      required: [id, state]
      properties:
        id: {type: string, pattern: "^[A-Za-z0-9._:-]{1,128}$"}
        state: {enum: [deleting, deleted]}
    RunRequest:
      type: object
      additionalProperties: false
      required: [argv]
      properties:
        argv:
          type: array
          minItems: 1
          maxItems: 1024
          items: {type: string}
          description: The program and its arguments, run directly without a shell.
        cwd:
          anyOf: [{$ref: "#/components/schemas/FilePath"}, {type: "null"}]
          default: null
          description: Working directory. Null means the class's default (`default_cwd`). A missing directory is `not_found`.
        env:
          $ref: "#/components/schemas/Env"
          description: Variables added to the sandbox's environment for this command only.
        timeout_ms:
          type: integer
          minimum: 1
          default: 60000
          description: How long the command may run, at most `limits.run_timeout_ms`.
        output_limit_bytes:
          type: integer
          minimum: 0
          default: 16777216
          description: Bytes kept per stream, at most `limits.output_bytes`.
        user:
          anyOf: [{$ref: "#/components/schemas/UserName"}, {type: "null"}]
          default: null
          description: >-
            The named user who runs the command. Null means the class's default user. A user the sandbox does not have is
            `not_found`, and the command does not run. A class that does not claim `user_selection` with `commands: true`
            answers `unsupported`.
        output:
          enum: [text, base64]
          default: text
          description: >-
            `text` returns `stdout` and `stderr` as UTF-8 text. `base64` returns the exact bytes of each stream as
            `stdout_base64` and `stderr_base64`, and leaves `stdout` and `stderr` empty. A class that does not list
            `run.base64` in `operations` answers `unsupported` to `base64`.
    RunResult:
      type: object
      required: [exit_code, stdout, stderr, stdout_truncated, stderr_truncated, timed_out]
      properties:
        exit_code:
          type: [integer, "null"]
          description: The exit status; 128 + N when signal N ended it; null only when `timed_out`.
        stdout: {type: string, description: "The first `output_limit_bytes` bytes of stdout, decoded as UTF-8 with invalid bytes replaced by U+FFFD."}
        stderr: {type: string, description: "The first `output_limit_bytes` bytes of stderr, decoded as UTF-8 with invalid bytes replaced by U+FFFD."}
        stdout_base64:
          type: string
          contentEncoding: base64
          description: "Present only when the request asked for `output: base64`: the first `output_limit_bytes` bytes of stdout, exactly. `stdout` is then empty."
        stderr_base64:
          type: string
          contentEncoding: base64
          description: "Present only when the request asked for `output: base64`: the first `output_limit_bytes` bytes of stderr, exactly. `stderr` is then empty."
        stdout_truncated: {type: boolean, description: "True when stdout was longer than the limit."}
        stderr_truncated: {type: boolean, description: "True when stderr was longer than the limit."}
        timed_out:
          type: boolean
          description: >-
            True when `timeout_ms` passed before the command exited. The provider ended the command and every process that it
            started.
    EntryType:
      enum: [file, directory, symlink, other]
      description: >-
        What an entry is: a regular file, a directory, a symbolic link (never followed), or `other` (a FIFO, a socket or a
        device).
    DirectoryEntry:
      type: object
      required: [name, type, size]
      properties:
        name: {type: string, minLength: 1, description: "The entry's name, UTF-8 with invalid bytes replaced by U+FFFD."}
        type: {$ref: "#/components/schemas/EntryType"}
        size: {type: integer, minimum: 0, description: "The entry's own size in bytes, as `lstat` reports it."}
    DirectoryPage:
      type: object
      required: [entries, next_cursor]
      properties:
        entries:
          type: array
          items: {$ref: "#/components/schemas/DirectoryEntry"}
          description: Entries in the byte order of their names.
        next_cursor:
          type: [string, "null"]
          description: Opaque. Null means that this page is the last one.
    PathInfo:
      type: object
      required: [exists, type]
      properties:
        exists: {type: boolean}
        type:
          anyOf: [{$ref: "#/components/schemas/EntryType"}, {type: "null"}]
          description: The type of the entry, null when none exists.
      allOf:
        - if: {properties: {exists: {const: true}}}
          then: {properties: {type: {$ref: "#/components/schemas/EntryType"}}}
          else: {properties: {type: {type: "null"}}}
    MkdirRequest:
      type: object
      additionalProperties: false
      required: [path]
      properties:
        path: {$ref: "#/components/schemas/FilePath"}
        parents: {type: boolean, default: false, description: "True also creates every missing ancestor."}
    FileInfo:
      type: object
      required: [path, size]
      properties:
        path: {$ref: "#/components/schemas/FilePath"}
        size: {type: integer, minimum: 0, description: "The bytes written."}
    ProcessStartRequest:
      type: object
      additionalProperties: false
      required: [argv]
      properties:
        argv:
          type: array
          minItems: 1
          maxItems: 1024
          items: {type: string}
          description: As for `run`.
        cwd:
          anyOf: [{$ref: "#/components/schemas/FilePath"}, {type: "null"}]
          default: null
          description: As for `run`.
        env: {$ref: "#/components/schemas/Env", description: "As for `run`."}
        stdin:
          type: boolean
          default: false
          description: Keep stdin open for `process.write_stdin` (needs the `processes` section with `input`).
        user:
          anyOf: [{$ref: "#/components/schemas/UserName"}, {type: "null"}]
          default: null
          description: >-
            As for `run`, with the `process_start` knob of `user_selection` in place of `commands`.
    Process:
      type: object
      required: [id, sandbox_id, started_at]
      properties:
        id:
          type: string
          pattern: "^[A-Za-z0-9._:-]{1,128}$"
          description: The process id. It names one process in the sandbox for as long as the provider keeps any record of it.
        sandbox_id: {type: string, pattern: "^[A-Za-z0-9._:-]{1,128}$"}
        started_at: {$ref: "#/components/schemas/Timestamp"}
    OutputChunk:
      type: object
      required: [stream, data]
      properties:
        stream: {enum: [stdout, stderr]}
        data: {type: string}
    OutputPage:
      type: object
      required: [chunks, next_cursor, gap, stdout_closed, stderr_closed, state, exit_code]
      properties:
        chunks:
          type: array
          items: {$ref: "#/components/schemas/OutputChunk"}
          description: >-
            New output in the order that each stream wrote it; the order between the two streams is unspecified.
        next_cursor: {type: string, minLength: 1, description: "Pass it to the next call to continue."}
        gap: {type: boolean, description: "True when output between `cursor` and the first chunk was discarded."}
        stdout_closed: {type: boolean, description: "Stdout reached end of file."}
        stderr_closed: {type: boolean, description: "Stderr reached end of file."}
        state: {enum: [running, exited], description: "Whether the process has exited."}
        exit_code:
          type: [integer, "null"]
          description: Set exactly when `state` is `exited`; 128 + N for signal N.
      allOf:
        - if:
            properties:
              state: {const: exited}
          then:
            properties:
              exit_code: {type: integer}
          else:
            properties:
              exit_code: {type: "null"}
    FileLinkRequest:
      type: object
      additionalProperties: false
      required: [path, operation, lifetime_seconds]
      properties:
        path: {$ref: "#/components/schemas/FilePath"}
        operation: {enum: [read, write]}
        lifetime_seconds: {type: integer, minimum: 1, description: "How long the link works."}
        size: {type: integer, minimum: 0, description: "The size of the file to write, when the operation is `write` and the provider needs it."}
    FileLink:
      type: object
      required: [method, url, headers, expires_at]
      properties:
        method: {type: string, minLength: 1, description: "The HTTP method to use on the URL."}
        url: {type: string, format: uri, description: "A provider-signed URL. It is sensitive: never log it."}
        headers: {type: object, additionalProperties: {type: string}, description: "Headers to send with the request."}
        form_field:
          type: [string, "null"]
          description: The multipart form field that carries the bytes, or null when the body is the raw bytes.
        expires_at: {$ref: "#/components/schemas/Timestamp"}
        reusable: {type: boolean, default: false, description: "True when the link may be used more than once."}
    ResumeRequest:
      type: object
      additionalProperties: false
      properties:
        lifetime_seconds:
          type: integer
          minimum: 1
          description: >-
            The lifetime the sandbox has left: the timer ends it this many seconds after the resume. Only for a class
            that lists `resume.lifetime`; left out, the provider's timer does what it does without it.
    LifetimeExtendRequest:
      type: object
      additionalProperties: false
      required: [seconds]
      properties:
        seconds: {type: integer, minimum: 1, description: "The sandbox may run at least this many seconds more from now."}
    PreviewRequest:
      type: object
      additionalProperties: false
      required: [port]
      properties:
        port: {$ref: "#/components/schemas/Port"}
        access:
          enum: [public, private]
          default: public
          description: "`public`: anyone with the URL reaches the port. `private`: the request must carry the link's credential."
        lifetime_seconds:
          type: [integer, "null"]
          minimum: 1
          description: "The link stops working this many seconds after it is made. Null or absent: the provider's own lifetime."
    PreviewLink:
      type: object
      required: [url, headers, expires_at]
      properties:
        url: {type: string, format: uri, description: "An HTTPS URL that reaches the port. It is sensitive: never log it."}
        headers: {type: object, additionalProperties: {type: string}, description: "Headers to send with each request."}
        expires_at:
          anyOf: [{$ref: "#/components/schemas/Timestamp"}, {type: "null"}]
          description: When the link stops working; null when it does not expire.
        id:
          type: [string, "null"]
          pattern: "^[A-Za-z0-9._:-]{1,128}$"
          description: "Names the link for `preview_revoke`; null when the class cannot revoke a link."
        access:
          enum: [public, private]
          description: "What the link is. Absent means `public`."
        credential:
          enum: [link, header, null]
          description: >-
            Where a private link's credential travels: `link` inside the URL, `header` in `headers`. Null for a public link
            and when absent.
    LabelsUpdateRequest:
      type: object
      additionalProperties: false
      required: [labels]
      properties:
        labels:
          type: object
          maxProperties: 32
          propertyNames: {pattern: "^[A-Za-z0-9_./-]{1,63}$"}
          additionalProperties: {type: string, maxLength: 255}
          description: "Each key is set to its value; an empty string removes the key. At most 32 entries."
    TcpLinkRequest:
      type: object
      additionalProperties: false
      required: [port]
      properties:
        port: {$ref: "#/components/schemas/Port"}
    TcpLink:
      type: object
      required: [host, port]
      properties:
        host: {type: string, minLength: 1}
        port: {$ref: "#/components/schemas/Port"}
    TerminalId:
      type: string
      pattern: "^[a-z0-9][a-z0-9-]{7,62}$"
      description: A caller-chosen name for a terminal (8 to 63 characters of `a-z 0-9 -`, as for an idempotency key).
    NetworkUpdateRequest:
      type: object
      additionalProperties: false
      required: [policy]
      properties:
        policy: {enum: [deny_all, allowlist, denylist, open]}
        allow:
          type: array
          maxItems: 4096
          items: {anyOf: [{type: string, minLength: 1}, {type: object}]}
          description: "The entries of an `allowlist`: host names, IPv4 addresses and ranges (`vocabulary.md`, `network_lockdown`). Required and nonempty for an `allowlist`."
        deny:
          type: array
          maxItems: 4096
          items: {anyOf: [{type: string, minLength: 1}, {type: object}]}
          description: "The entries of a `denylist`. Required and nonempty for a `denylist`."
    TerminalRequest:
      type: object
      additionalProperties: false
      properties:
        id:
          anyOf: [{$ref: "#/components/schemas/TerminalId"}, {type: "null"}]
          default: null
          description: >-
            Names the terminal so that `terminal_reattach` and `terminal_end` can reach it. Only a class that claims
            `terminal` with `reattach: true` accepts it (any other refuses it with `unsupported`). With an id, closing the
            connection detaches the terminal and its program keeps running (see `provider-api.md` section 16). Null: no
            reattach, and a closed connection ends the terminal.
        argv:
          anyOf:
            - type: array
              minItems: 1
              maxItems: 1024
              items: {type: string}
            - type: "null"
          default: null
          description: The program to run on the terminal. Null means the default user's login shell (`bash -l` in a sandbox created without an image).
        cwd:
          anyOf: [{$ref: "#/components/schemas/FilePath"}, {type: "null"}]
          default: null
          description: As for `run`. A missing directory is `not_found`, reported when the link is connected.
        env: {$ref: "#/components/schemas/Env", description: "As for `run`."}
        columns: {type: integer, minimum: 1, maximum: 1000, default: 80, description: "The terminal's width in characters."}
        rows: {type: integer, minimum: 1, maximum: 1000, default: 24, description: "The terminal's height in lines."}
        term:
          type: string
          minLength: 1
          maxLength: 64
          pattern: "^[A-Za-z0-9._+-]+$"
          default: xterm-256color
          description: The `TERM` value that the program sees.
    TerminalLink:
      type: object
      required: [url, headers, expires_at]
      properties:
        url: {type: string, format: uri, description: "A provider-signed, single-use `wss://` URL (`ws://` where plain HTTP is allowed). It is sensitive: never log it."}
        headers: {type: object, additionalProperties: {type: string}, description: "Headers to send with the WebSocket handshake. They never include the consumer's credential."}
        expires_at: {$ref: "#/components/schemas/Timestamp", description: "30 to 600 seconds after the call. A second connection, or one after this time, is refused with an HTTP status from 400 to 499 before the upgrade."}
