        "403": {$ref: "#/components/responses/Forbidden"}
        "422": {$ref: "#/components/responses/Unsupported"}
        "429": {$ref: "#/components/responses/RateLimited"}
        "500": {$ref: "#/components/responses/ProviderError"}
