- id: coverage.facts.max_run
  title: A foreground command completes after at least 600 seconds.
  rules:
  - facts/max-run
  proves:
  - fact: resources.max_run_seconds
    value:
      at_least: 600
  steps:
  - op: create
    as: box
    in:
      lifetime_seconds: 900
  - op: run
    target: box
    in:
      bash_script: python3 -c 'import time; started=time.monotonic(); time.sleep(600); print("sps-runtime-proof"
        if time.monotonic()-started >= 600 else "too-short")'
      timeout_ms: 0
    expect:
      equals:
        exit_code: 0
        stdout:
          utf8: 'sps-runtime-proof

            '
- id: coverage.facts.max_process
  title: A background process completes after at least 600 seconds.
  rules:
  - facts/max-process
  proves:
  - fact: resources.max_process_seconds
    value:
      at_least: 600
  steps:
  - op: create
    as: box
    in:
      lifetime_seconds: 900
  - op: process.start
    target: box
    in:
      bash_script: python3 -c 'import time; from pathlib import Path; started=time.monotonic(); time.sleep(600);
        Path("/tmp/sps-process-runtime-proof").write_text("600" if time.monotonic()-started >= 600 else
        "short")'
      timeout_ms: 0
    as: process
  - wait_ms: 600000
  - op: process.wait
    target: process
    in:
      timeout_ms: 60000
    expect:
      equals:
        exit_code: 0
  - op: files.read_bytes
    target: box
    in:
      path: /tmp/sps-process-runtime-proof
    expect:
      equals:
        data:
          utf8: '600'
