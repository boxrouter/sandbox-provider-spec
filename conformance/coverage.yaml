- id: baseline.files_write_binary
  title: The file API writes any bytes that a command can read back.
  rules:
  - baseline/files
  proves: []
  steps:
  - op: create
    as: box
  - op: files.write
    target: box
    in:
      path: /tmp/sps-binary
      data: AP8AgP5mAA==
  - op: run
    target: box
    in:
      bash_script: python3 -c 'print(open("/tmp/sps-binary","rb").read().hex())'
    expect:
      equals:
        exit_code: 0
        stdout:
          utf8: "00ff0080fe6600\n"
- id: coverage.volumes.read_only
  title: A read-only volume mount allows reads and blocks writes for every user.
  rules:
  - volumes/read-only
  proves:
  - gate: volumes
    knob: read_only_mounts
    value: true
  steps:
  - op: volume.create
    in:
      kind: filesystem
    as: vol
  - op: create
    as: seed
    in:
      volumes:
      - volume: $vol
        path: /sps-volume
        read_only: false
      requirements:
        volumes:
          kind: filesystem
  - op: files.write
    target: seed
    in:
      path: /sps-volume/seed
      data: c2VlZA==
  - op: destroy
    target: seed
  - op: create
    as: box
    in:
      volumes:
      - volume: $vol
        path: /sps-volume
        read_only: true
      requirements:
        volumes:
          kind: filesystem
          read_only_mounts: true
  - op: run
    target: box
    in:
      bash_script: cat /sps-volume/seed
    expect:
      equals:
        exit_code: 0
        stdout:
          utf8: "seed"
  - op: run
    target: box
    in:
      bash_script: if printf x > /sps-volume/default-write 2>/dev/null; then printf writable; else printf denied; fi
    expect:
      equals:
        exit_code: 0
        stdout:
          utf8: denied
  - op: run.as_root
    target: box
    in:
      bash_script: if printf x > /sps-volume/root-write 2>/dev/null; then printf writable; else printf denied; fi
    expect:
      equals:
        exit_code: 0
        stdout:
          utf8: denied
