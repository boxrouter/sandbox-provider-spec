# The ceiling probe tries exact enforced cgroup bounds first; when they cannot
# prove the ceiling (a dedicated VM's bound is its hardware, not a cgroup) it
# measures use instead: an over-subscribed CPU burn must not exceed the request,
# then a memory hog targeting twice the allocation must be killed or refused.
# Both methods can prove false as well as true.
- id: coverage.facts.size_is_ceiling.true
  title: A declared size limits CPU and memory use.
  rules:
  - facts/size-is-ceiling
  proves:
  - fact: resources.size_is_ceiling
    value: true
  steps:
  - op: create
    as: box
    in:
      lifetime_seconds: 300
      resources:
        "<<": $runner.test_size
        size_is_ceiling: true
  - op: fixture.coverage_fact
    target: box
    in:
      probe: size_is_ceiling
      size: $runner.test_size_value
    expect:
      record: [ceiling_evidence]
      equals:
        size_is_ceiling: true
- id: coverage.facts.size_is_ceiling.false
  title: A declared size does not limit CPU or memory use.
  rules:
  - facts/size-is-ceiling
  proves:
  - fact: resources.size_is_ceiling
    value: false
  steps:
  - op: create
    as: box
    in:
      lifetime_seconds: 300
      resources: $runner.test_size
  - op: fixture.coverage_fact
    target: box
    in:
      probe: size_is_ceiling
      size: $runner.test_size_value
    expect:
      equals:
        size_is_ceiling: false
