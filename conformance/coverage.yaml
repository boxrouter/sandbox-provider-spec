    as: second
  - op: bindings.compare
    in:
      left: $first.key
      right: $second.key
    expect:
      equals:
        equal: true
  - op: bindings.compare
    in:
      left: $first.identity
      right: $second.identity
    expect:
      equals:
        equal: true
