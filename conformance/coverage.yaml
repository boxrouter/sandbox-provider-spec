- id: coverage.previews.websocket
  title: A public preview supports websocket.
  rules:
  - previews/websocket
  proves:
  - gate: previews
    knob: websocket
    value: true
  steps:
  - op: create
    as: box
    in:
      lifetime_seconds: 300
      requirements:
        previews:
          access: public
          ports:
          - 8765
          websocket: true
  - op: fixture.coverage_server
    target: box
    in:
      protocol: websocket
      ports:
      - 8765
      bind: 0.0.0.0
  - op: preview.link
    target: box
    in:
      port: 8765
      access: public
    as: link
  - op: probe.websocket
    in:
      url: $link.url
    expect:
      equals:
