spec: sandbox-provider-spec/0.1
tests:
- id: guest_user.selectable
  title: Commands, file writes and processes can select a named guest user.
  rules:
  - user-selection/commands
  - user-selection/files-write
  - user-selection/process-start
  proves:
  - gate: user_selection
    knob: commands
    value: true
  - gate: user_selection
    knob: files_write
    value: true
  - gate: user_selection
    knob: process_start
    value: true
  steps:
  - op: image.prepare
    as: image
    in:
      source: dockerfile
      dockerfile: |
        FROM public.ecr.aws/docker/library/python:3.12-slim
        RUN useradd --create-home --uid 10001 --shell /bin/bash runner
  - op: create
    as: box
    in:
      image: $image
      requirements:
        custom_images: {source: dockerfile}
  - op: run
    target: box
    in:
      bash_script: id -un
      run_as: runner
    expect:
      equals:
        exit_code: 0
        stdout: {utf8: "runner\n"}
  - op: files.write
    target: box
    in:
      path: /tmp/sps-user-selection-file
      data: Y29uZm9ybWFuY2UK
      user: runner
  - op: run
    target: box
    in:
      bash_script: test "$(stat -c '%u' /tmp/sps-user-selection-file)" = "$(id -u runner)"
    expect:
      equals:
        exit_code: 0
  - op: run
    target: box
    in:
      bash_script: chmod 0600 /tmp/sps-user-selection-file && stat -c '%U %a' /tmp/sps-user-selection-file
      run_as: runner
    expect:
      equals:
        exit_code: 0
        stdout: {utf8: "runner 600\n"}
  - op: files.read_bytes
    target: box
    in:
      path: /tmp/sps-user-selection-file
    expect:
      equals:
        data: {utf8: "conformance\n"}
  - op: process.start
    target: box
    as: process
    in:
      bash_script: id -un > /tmp/sps-user-selection-process
      run_as: runner
  - op: process.wait
    target: process
    in:
      timeout_ms: 30000
    expect:
      equals:
        exit_code: 0
  - op: files.read_bytes
    target: box
    in:
      path: /tmp/sps-user-selection-process
    expect:
      equals:
        data: {utf8: "runner\n"}
- id: coverage.facts.max_lifetime.active
  title: A sandbox kept active survives the observed lifetime window.
  rules:
  - facts/max-lifetime
  proves:
  - fact: resources.max_lifetime_seconds
    value:
      at_least: $runner.max_lifetime_observed_seconds
  steps:
  - op: create
    as: box
    in:
      lifetime_seconds: $runner.max_lifetime_seconds
  - op: fixture.coverage_active_lifetime
    target: box
    in:
      wait_ms: $runner.max_lifetime_wait_ms
    expect:
      equals:
        state: active
        window_completed: true
