- id: coverage.tcp_ports.none
  title: Public TCP endpoints echo binary bytes through none transport.
  rules:
  - tcp_ports/reachable
  - tcp_ports/tls-none
  proves:
  - gate: tcp_ports
    knob: tls
    value: none
  - gate: tcp_ports
    knob: max_tcp_ports
    value:
      at_least: 2
  steps:
  - op: create
    as: box
    in:
      lifetime_seconds: 300
      requirements:
        tcp_ports:
          tls: none
          ports:
          - 7777
          - 7778
  - op: fixture.coverage_server
    target: box
    in:
      protocol: tcp
      ports:
      - 7777
      - 7778
    as: server
  - op: tcp.link
    target: box
    in:
      port: 7777
      tls: none
    as: first
  - op: probe.tcp
    in:
      endpoint: $first
      tls: none
    expect:
      equals:
        binary_echo: true
  - op: tcp.link
    target: box
    in:
      port: 7778
      tls: none
    as: second
  - op: probe.tcp
    in:
      endpoint: $second
      tls: none
    expect:
      equals:
        binary_echo: true
