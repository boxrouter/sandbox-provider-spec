          utf8: saved
- id: volumes.kind.filesystem
  title: A filesystem volume preserves writes across sandbox deletion.
  rules:
  - volumes/persists
  - volumes/filesystem-locks
  proves:
  - gate: volumes
    knob: kind
    value: filesystem
  steps:
  - op: volume.create
    in:
      kind: filesystem
    as: vol
  - op: create
    in:
      volumes:
      - volume: $vol
        path: /sps-volume
      requirements:
        volumes:
          kind: filesystem
    as: box
  - op: files.write
    target: box
    in:
      path: /sps-volume/a
      data: c2F2ZWQ=
  - op: destroy
    target: box
  - op: create
    in:
      volumes:
      - volume: $vol
        path: /sps-volume
      requirements:
        volumes:
          kind: filesystem
    as: again
  - op: files.read_bytes
    target: again
    in:
      path: /sps-volume/a
    expect:
      equals:
        data:
          utf8: saved
  - op: process.start
    target: again
    in:
      bash_script: flock /sps-volume/lock -c "printf held >/sps-volume/held; while [ ! -f /sps-volume/unlock
        ]; do sleep 0.1; done"
      timeout_ms: 120000
    as: holder
  - op: files.exists
    target: again
    in:
      path: /sps-volume/held
    expect:
      equals:
        exists: true
      eventually_ms: 5000
  - op: run
    target: again
    in:
      bash_script: flock -n -E 75 /sps-volume/lock -c true
    expect:
      equals:
        exit_code: 75
  - op: files.write
    target: again
    in:
      path: /sps-volume/unlock
      data: Z28=
  - op: process.wait
    target: holder
    expect:
      equals:
        exit_code: 0
      eventually_ms: 5000
  - op: run
    target: again
    in:
      bash_script: flock -n -E 75 /sps-volume/lock -c true
    expect:
      equals:
        exit_code: 0
