        stdout:
          utf8: denied
  - op: files.write
    target: box
    in:
      path: /sps-volume/a
      data: c2F2ZWQ=
  - op: files.read_bytes
    target: again
    in:
      path: /sps-volume/a
    expect:
      equals:
        data:
          utf8: saved
  - op: files.write
    target: again
    in:
      path: /sps-volume/b
      data: c2F2ZWQ=
  - op: files.read_bytes
    target: box
    in:
      path: /sps-volume/b
    expect:
