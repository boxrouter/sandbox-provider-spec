- id: volumes.sharing.one_sandbox
  title: Volume sharing supports one sandbox.
  rules: [volumes/one-sandbox]
  proves:
  - gate: volumes
    knob: sharing
    value: one_sandbox
  steps:
  - op: volume.create
    in:
      kind: filesystem
    as: vol
  - op: create
    in:
      volumes:
      - volume: $vol
        path: /sps-volume
        read_only: false
      requirements:
        volumes:
          sharing: one_sandbox
          kind: filesystem
    as: box
  - op: files.write
    target: box
    in:
      path: /sps-volume/a
      data: c2F2ZWQ=
  - op: create
    in:
      volumes:
      - volume: $vol
        path: /sps-volume
      requirements:
        volumes:
          sharing: one_sandbox
          kind: filesystem
    expect:
      error: volume_in_use
- id: volumes.sharing.many_writers
  title: Volume sharing supports many writers.
  rules:
  - volumes/many-writers
  proves:
  - gate: volumes
    knob: sharing
    value: many_writers
  steps:
  - op: volume.create
    in:
      kind: filesystem
    as: vol
  - op: create
    in:
      volumes:
      - volume: $vol
        path: /sps-volume
        read_only: false
      requirements:
        volumes:
          sharing: many_writers
          kind: filesystem
