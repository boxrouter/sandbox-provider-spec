spec: sandbox-provider-spec/0.1
tests:
- id: baseline.create_env
  title: Creation passes environment variables to guest code.
  steps:
  - op: create
    in:
      environment:
        SPS_PROBE: present
    as: box
  - op: run
    target: box
    in:
      bash_script: printf "$SPS_PROBE"
    expect:
      equals:
        stdout:
          utf8: present
  rules:
  - baseline/lifecycle
  proves: []
- id: baseline.get
  title: Get observes a created sandbox without creating another.
  steps:
  - op: create
    as: box
  - op: get
    target: box
    expect:
      equals:
        state: active
  rules:
  - baseline/lifecycle
  proves: []
- id: baseline.list
  title: Native list includes the created sandbox identity.
  steps:
  - op: create
    as: box
  - op: list
    expect:
      contains:
        sandboxes:
          identity: $box.identity
      eventually_ms: 30000
  rules:
  - baseline/lifecycle
  proves: []
- id: baseline.destroy
  title: Destroy ends the sandbox and get confirms native absence.
  steps:
  - op: create
    as: box
  - op: destroy
    target: box
  - op: get
    target: box
    expect:
      equals:
        state: destroyed
      eventually_ms: 30000
  rules:
  - baseline/lifecycle
  proves: []
- id: baseline.run_output
  title: A completed command returns its stdout.
  steps:
  - op: create
    as: box
  - op: run
    target: box
    in:
      bash_script: printf out
    expect:
      equals:
        stdout:
          utf8: out
  rules:
  - baseline/run
  proves: []
- id: baseline.run_exit_code
  title: A failed command returns its native exit status.
  steps:
  - op: create
    as: box
  - op: run
    target: box
    in:
      bash_script: exit 7
    expect:
      equals:
        exit_code: 7
  rules:
  - baseline/run
  proves: []
- id: baseline.run_separate_streams
  title: A command preserves the distinction between stdout and stderr.
  steps:
  - op: create
    as: box
  - op: run
    target: box
    in:
      bash_script: printf 'out\n'; printf 'err\n' >&2
      separate_streams: true
    expect:
      equals:
        stdout:
          utf8: 'out

            '
        stderr:
          utf8: 'err

            '
  rules:
  - baseline/run
  proves: []
- id: baseline.run_cwd
  title: The SDK selects a command working directory.
  steps:
  - op: create
    as: box
  - op: run
    target: box
    in:
      bash_script: pwd
      cwd: /tmp
    expect:
      equals:
        stdout:
          utf8: '/tmp

            '
  rules:
  - baseline/run
  proves: []
- id: baseline.run_env
  title: The SDK passes per-command environment variables.
  steps:
  - op: create
    as: box
  - op: run
    target: box
    in:
      bash_script: printf "$SPS_PROBE"
      environment:
        SPS_PROBE: command
    expect:
      equals:
        stdout:
          utf8: command
  rules:
  - baseline/run
  proves: []
- id: baseline.files_write
  title: The file API writes bytes that can be read back.
  steps:
  - op: create
    as: box
  - op: run
    target: box
    in:
      bash_script: mkdir -p /tmp/sps-files
    expect:
      equals:
        exit_code: 0
  - op: files.write
    target: box
    in:
      path: /tmp/sps-files/a
      data: aGVsbG8=
  - op: files.read_bytes
    target: box
    in:
      path: /tmp/sps-files/a
    expect:
      equals:
        data:
          utf8: hello
  rules:
  - baseline/files
  proves: []
- id: baseline.files_read
  title: The file API reads binary bytes created by guest code.
  steps:
  - op: create
    as: box
  - op: run
    target: box
    in:
      bash_script: printf '\000\377file' >/tmp/sps-read
    expect:
      equals:
        exit_code: 0
  - op: files.read_bytes
    target: box
    in:
      path: /tmp/sps-read
    expect:
      equals:
        data:
          b64: AP9maWxl
  rules:
  - baseline/files
  proves: []
- id: baseline.process_stream
  title: A native background process exposes streamed output.
  steps:
  - op: create
    as: box
  - op: clock.start
    as: stream_clock
  - op: process.start
    target: box
    in:
      bash_script: printf "stream-marker\n"; sleep 15; printf released
    as: proc
  - op: process.output
    target: proc
    expect:
      equals:
        stdout:
          utf8_contains: stream-marker
    in:
      first_chunk: true
  - op: clock.observe
    in:
      started: $stream_clock.started
      limit_ms: 15000
    expect:
      equals:
        within_window: true
  - op: process.wait
    target: proc
    expect:
      equals:
        exit_code: 0
      eventually_ms: 5000
  rules:
  - baseline/process-output
  proves: []
- id: processes.input.true
  title: A native process receives interactive stdin.
  steps:
  - op: create
    as: box
    in:
      requirements:
        processes:
          input: true
  - op: process.start
    target: box
    in:
      bash_script: read line; printf "%s" "$line"
    as: proc
  - op: process.write_stdin
    target: proc
    in:
      data: aGVsbG8K
  - op: process.output
    target: proc
    expect:
      equals:
        stdout:
          utf8_contains: hello
      eventually_ms: 5000
  rules:
  - processes/input
  proves:
  - gate: processes
    knob: input
    value: true
- id: processes.input.false
  title: The pinned native SDK has no input operation.
  rules:
  - processes/input
  proves:
  - gate: processes
    knob: input
    value: false
  steps:
  - op: native.operation_absent
    in:
      operation: process.write_stdin
    expect:
      equals:
        absent: true
- id: processes.cancel.true
  title: A native process can be cancelled.
  steps:
  - op: create
    as: box
    in:
      requirements:
        processes:
          cancel: true
      lifetime_seconds: 300
  - op: clock.start
    as: cancel_clock
  - op: process.start
    target: box
    in:
      bash_script: echo $$ >/tmp/sps-cancel-pid; exec sleep 180
      timeout_ms: 240000
    as: proc
  - op: files.exists
    target: box
    in:
      path: /tmp/sps-cancel-pid
    expect:
      equals:
        exists: true
      eventually_ms: 5000
  - op: fixture.process_state
    target: box
    as: running
    expect:
      equals:
        stopped: false
  - op: process.cancel
    target: proc
  - op: fixture.process_state
    target: box
    in:
      identity: $running.identity
    expect:
      equals:
        stopped: true
      eventually_ms: 5000
  - op: clock.observe
    in:
      started: $cancel_clock.started
      limit_ms: 120000
    expect:
      equals:
        within_window: true
  - op: get
    target: box
    expect:
      equals:
        state: active
  rules:
  - processes/cancel
  proves:
  - gate: processes
    knob: cancel
    value: true
- id: processes.cancel.false
  title: The pinned native SDK has no cancel operation.
  rules:
  - processes/cancel
  proves:
  - gate: processes
    knob: cancel
    value: false
  steps:
  - op: native.operation_absent
    in:
      operation: process.cancel
    expect:
      equals:
        absent: true
- id: processes.reattach.true
  title: The SDK reconnects to a running process and observes subsequent output.
  steps:
  - op: create
    as: box
    in:
      requirements:
        processes:
          reattach: true
      lifetime_seconds: 300
  - op: process.start
    target: box
    in:
      bash_script: printf before; while [ ! -f /tmp/sps-reattach-release ]; do sleep 0.1; done; printf
        after
      timeout_ms: 240000
    as: proc
  - op: process.disconnect
    target: proc
  - op: process.reattach
    target: box
    in:
      identity: $proc.identity
    as: again
  - op: files.write
    target: box
    in:
      path: /tmp/sps-reattach-release
      data: Z28=
  - op: process.output
    target: again
    expect:
      equals:
        stdout:
          utf8_contains: after
      eventually_ms: 5000
  rules:
  - processes/reattach
  proves:
  - gate: processes
    knob: reattach
    value: true
- id: processes.reattach.false
  title: The pinned native SDK has no reattach operation.
  rules:
  - processes/reattach
  proves:
  - gate: processes
    knob: reattach
    value: false
  steps:
  - op: native.operation_absent
    in:
      operation: process.reattach
    expect:
      equals:
        absent: true
- id: terminal.interactive
  title: A native PTY accepts input and returns terminal output.
  steps:
  - op: create
    as: box
    in:
      requirements:
        terminal: {}
  - op: terminal.open
    target: box
    in:
      columns: 80
      rows: 24
    as: tty
  - op: terminal.write
    target: tty
    in:
      data: dGVzdCAtdCAwICYmIHRlc3QgLXQgMSAmJiBwcmludGYgUFRZX09LOyBleGl0DQ==
  - op: terminal.output
    target: tty
    in:
      until_contains: PTY_OK
      timeout_ms: 60000
    expect:
      equals:
        terminal:
          utf8_contains: PTY_OK
  rules:
  - terminal/interactive
  proves:
  - gate: terminal
    value: true
- id: terminal.v1.resize
  title: A terminal reports the size it was opened with, and the size it was resized to.
  steps:
  - op: create
    as: box
    in:
      requirements:
        terminal: {}
  - op: terminal.open
    target: box
    in:
      columns: 80
      rows: 24
    as: tty
  - op: terminal.write
    target: tty
    in:
      data: c3R0eSBzaXplDQ==
  - op: terminal.output
    target: tty
    in:
      until_contains: 24 80
      timeout_ms: 60000
    expect:
      equals:
        terminal:
          utf8_contains: 24 80
  - op: terminal.resize
    target: tty
    in:
      columns: 100
      rows: 40
  - op: terminal.write
    target: tty
    in:
      data: c3R0eSBzaXplDQ==
  - op: terminal.output
    target: tty
    in:
      until_contains: 40 100
      timeout_ms: 60000
    expect:
      equals:
        terminal:
          utf8_contains: 40 100
  rules:
  - provider-api/terminal-resize
  proves:
  - gate: terminal
    value: true
- id: terminal.v1.exit_status
  title: A terminal returns the program's output, then its exit status.
  steps:
  - op: create
    as: box
    in:
      requirements:
        terminal: {}
  - op: terminal.open
    target: box
    in:
      argv:
      - bash
      - -c
      - printf T_EXIT; exit 7
    as: tty
  - op: terminal.output
    target: tty
    in:
      until_contains: T_EXIT
      timeout_ms: 60000
    expect:
      equals:
        terminal:
          utf8_contains: T_EXIT
  - op: terminal.wait
    target: tty
    in:
      timeout_ms: 60000
    expect:
      equals:
        exit_code: 7
  rules:
  - provider-api/terminal-exit
  - provider-api/terminal-messages
  proves:
  - gate: terminal
    value: true
- id: terminal.v1.start_options
  title: A terminal starts its program in the given directory, with the given variable and TERM.
  steps:
  - op: create
    as: box
    in:
      requirements:
        terminal: {}
  - op: terminal.open
    target: box
    in:
      argv:
      - bash
      - -c
      - printf '%s|%s|%s' "$PWD" "$SPS_TTY" "$TERM"
      cwd: /tmp
      environment:
        SPS_TTY: 'yes'
      term: vt100
    as: tty
  - op: terminal.output
    target: tty
    in:
      until_contains: /tmp|yes|vt100
      timeout_ms: 60000
    expect:
      equals:
        terminal:
          utf8_contains: /tmp|yes|vt100
  rules:
  - provider-api/terminal-start
  proves:
  - gate: terminal
    value: true
- id: terminal.v1.missing_cwd
  title: A terminal in a directory that does not exist fails with not_found.
  steps:
  - op: create
    as: box
    in:
      requirements:
        terminal: {}
  - op: terminal.open
    target: box
    in:
      cwd: /sps-test-no-such-directory
    as: tty
  - op: terminal.output
    target: tty
    in:
      first_chunk: true
      timeout_ms: 60000
    expect:
      error: not_found
  rules:
  - provider-api/terminal-start
  proves:
  - gate: terminal
    value: true
- id: terminal.v1.close_ends_program
  title: Closing a terminal ends its program.
  steps:
  - op: create
    as: box
    in:
      requirements:
        terminal: {}
  - op: terminal.open
    target: box
    as: tty
  - op: terminal.write
    target: tty
    in:
      data: ZWNobyAkJCA+L3RtcC9zcHMtdHR5LXBpZA0=
  - op: files.exists
    target: box
    in:
      path: /tmp/sps-tty-pid
    expect:
      equals:
        exists: true
      eventually_ms: 20000
  - op: terminal.close
    target: tty
  - op: run
    target: box
    in:
      bash_script: sleep 7; test -d /proc/$(cat /tmp/sps-tty-pid) && echo alive || echo gone
      timeout_ms: 60000
    expect:
      equals:
        stdout:
          utf8_contains: gone
  rules:
  - provider-api/terminal-close-ends
  proves:
  - gate: terminal
    value: true
- id: terminal.v1.ordered_output
  title: A terminal delivers a long output in order, with nothing dropped or repeated.
  steps:
  - op: create
    as: box
    in:
      requirements:
        terminal: {}
  - op: terminal.open
    target: box
    as: tty
  - op: fixture.terminal_ordered_output
    target: tty
    in:
      timeout_ms: 60000
    expect:
      equals:
        ordered: true
  rules:
  - provider-api/terminal-ordered-output
  proves:
  - gate: terminal
    value: true
- id: terminal.v1.link_single_use
  title: A terminal link serves one connection, and a second one is refused before the upgrade.
  steps:
  - op: create
    as: box
    in:
      requirements:
        terminal: {}
  - op: terminal.link_reuse
    target: box
    expect:
      equals:
        second_refused: true
  rules:
  - provider-api/terminal-link
  proves:
  - gate: terminal
    value: true
- id: terminal.v1.idle_kept
  title: A terminal that is idle for 40 seconds is still there afterwards.
  steps:
  - op: create
    as: box
    in:
      requirements:
        terminal: {}
  - op: terminal.open
    target: box
    as: tty
  - wait_ms: 40000
  - op: terminal.write
    target: tty
    in:
      data: cHJpbnRmICdBTCVzVkUnIEkN
  - op: terminal.output
    target: tty
    in:
      until_contains: ALIVE
      timeout_ms: 60000
    expect:
      equals:
        terminal:
          utf8_contains: ALIVE
  rules:
  - provider-api/terminal-liveness
  proves:
  - gate: terminal
    value: true
- id: baseline.environment_bash
  title: The default environment contains bash.
  steps:
  - op: create
    as: box
  - op: run
    target: box
    in:
      bash_script: command -v bash
    expect:
      equals:
        exit_code: 0
      record:
      - stdout
  rules:
  - baseline/environment
  proves: []
- id: baseline.environment_python3
  title: The default environment contains python3.
  steps:
  - op: create
    as: box
  - op: run
    target: box
    in:
      bash_script: command -v python3
    expect:
      equals:
        exit_code: 0
      record:
      - stdout
  rules:
  - baseline/environment
  proves: []
- id: facts.default_user
  title: Observe the provider default guest user.
  steps:
  - op: create
    as: box
  - op: environment.observe
    target: box
    in:
      fact: default_user
    as: environment
    expect:
      record:
      - default_user
  rules:
  - facts/default-environment
  proves:
  - fact: resources.default_user
    value: $observed.default_user
- id: facts.default_cwd
  title: Observe the provider default guest cwd.
  steps:
  - op: create
    as: box
  - op: environment.observe
    target: box
    in:
      fact: default_cwd
    as: environment
    expect:
      record:
      - default_cwd
  rules:
  - facts/default-environment
  proves:
  - fact: resources.default_cwd
    value: $observed.default_cwd
- id: baseline.outbound_network
  title: The default environment can reach a positively checked public endpoint.
  steps:
  - op: create
    as: box
  - op: probe.http
    in:
      url: $runner.reachable_url
    expect:
      equals:
        served: true
  - op: run
    target: box
    in:
      bash_script: if command -v curl >/dev/null; then curl --noproxy '*' -fsS -m 15 -o /dev/null "$TARGET";
        else python3 -c 'import os, urllib.request; urllib.request.build_opener(urllib.request.ProxyHandler({})).open(os.environ["TARGET"],
        timeout=15).read(1)'; fi
      environment:
        TARGET: $runner.reachable_url
    expect:
      equals:
        exit_code: 0
  rules:
  - baseline/outbound-network
  proves: []
- id: facts.extendable_lifetime
  title: Observe the native extendable lifetime guarantee.
  rules:
  - facts/extendable-lifetime
  proves:
  - fact: resources.extendable_lifetime
    value: true
  steps:
  - lane: extended
    op: create
    in:
      lifetime_seconds: 300
    as: box
  - lane: extended
    op: lifetime.extend
    target: box
    in:
      lifetime_seconds: 420
  - lane: extended
    wait_ms: 305000
  - lane: extended
    op: run
    target: box
    in:
      bash_script: 'true'
    expect:
      equals:
        exit_code: 0
  - lane: extended
    op: get
    target: box
    expect:
      equals:
        state:
          one_of:
          - active
          - paused
  - lane: control
    op: create
    in:
      lifetime_seconds: 300
    as: control
  - lane: control
    wait_ms: 305000
  - lane: control
    op: get
    target: control
    expect:
      equals:
        state:
          one_of:
          - paused
          - stopped
          - destroyed
      eventually_ms: 30000
- id: lifetime_timer.at_end.destroyed
  title: The native lifetime timer ends in state destroyed.
  rules:
  - facts/lifetime-timer
  - provider-api/lifetime-enforced
  proves:
  - fact: lifetime_timer.at_end
    value: destroyed
  - fact: lifetime_timer.enforced_by
    value: provider
  steps:
  - op: create
    in:
      lifetime_seconds: 300
      at_end: destroyed
    as: box
  - wait_ms: 305000
  - op: get
    target: box
    expect:
      equals:
        state: destroyed
      eventually_ms: 30000
- id: lifetime_timer.at_end.stopped
  title: The native lifetime timer ends in state stopped.
  rules: [facts/lifetime-timer]
  proves:
  - fact: lifetime_timer.at_end
    value: stopped
  - fact: lifetime_timer.enforced_by
    value: provider
  steps:
  - op: create
    in:
      lifetime_seconds: 60
      at_end: stopped
    as: box
  - wait_ms: 65000
  - op: get
    target: box
    expect:
      equals:
        state: stopped
      eventually_ms: 30000
- id: lifetime_timer.at_end.paused
  title: The native lifetime timer ends in state paused.
  rules: [facts/lifetime-timer]
  proves:
  - fact: lifetime_timer.at_end
    value: paused
  - fact: lifetime_timer.enforced_by
    value: provider
  steps:
  - op: create
    in:
      lifetime_seconds: 60
      at_end: paused
    as: box
  - wait_ms: 65000
  - op: get
    target: box
    expect:
      equals:
        state: paused
      eventually_ms: 30000
- id: lifetime_timer.counts_paused_time.true
  title: A paused sandbox expires across its initial lifetime.
  rules: [facts/lifetime-timer]
  proves:
  - fact: lifetime_timer.counts_paused_time
    value: true
  steps:
  - op: create
    in:
      lifetime_seconds: 60
      requirements:
        pause_resume: {}
    as: box
  - op: pause
    target: box
  - wait_ms: 65000
  - op: lifetime.observe_paused_countdown
    target: box
    in:
      original_lifetime_seconds: 60
    expect:
      equals:
        counts_paused_time: true
- id: lifetime_timer.counts_paused_time.false
  title: A paused sandbox stays available across its initial lifetime.
  rules: [facts/lifetime-timer]
  proves:
  - fact: lifetime_timer.counts_paused_time
    value: false
  steps:
  - op: create
    in:
      lifetime_seconds: 60
      requirements:
        pause_resume: {}
    as: box
  - op: pause
    target: box
  - wait_ms: 65000
  - op: lifetime.observe_paused_countdown
    target: box
    in:
      original_lifetime_seconds: 60
    expect:
      equals:
        counts_paused_time: false
- id: pause_resume.files_only
  title: Pause and resume preserve files only.
  rules:
  - pause_resume/files-only
  proves:
  - gate: pause_resume
    knob: keeps
    value: files_only
  steps:
  - op: create
    in:
      requirements:
        pause_resume:
          keeps: files_only
    as: box
  - op: files.write
    target: box
    in:
      path: /tmp/sps-marker
      data: c2F2ZWQ=
  - op: process.start
    target: box
    in:
      bash_script: echo $$ >/tmp/sps-pid; SPS_MEMORY_PAYLOAD=memory-marker; while [ ! -f /tmp/sps-release
        ]; do sleep 0.1; done; printf "%s" "$SPS_MEMORY_PAYLOAD" >/tmp/sps-result
      timeout_ms: 180000
    as: proc
  - op: files.exists
    target: box
    in:
      path: /tmp/sps-pid
    expect:
      equals:
        exists: true
      eventually_ms: 5000
  - op: pause
    target: box
    in:
      keeps: files_only
  - op: resume
    target: box
    in:
      keeps: files_only
    as: again
  - op: files.exists
    target: again
    in:
      path: /tmp/sps-marker
    expect:
      equals:
        exists: true
  - op: files.read_bytes
    target: again
    in:
      path: /tmp/sps-marker
    expect:
      equals:
        data:
          utf8: saved
  - op: run
    target: again
    in:
      bash_script: if [ -r /proc/"$(cat /tmp/sps-pid)"/cmdline ]; then tr "\000" " " </proc/"$(cat /tmp/sps-pid)"/cmdline;
        fi
    expect:
      equals: &id001
        stdout:
          utf8_absent: SPS_MEMORY_PAYLOAD
- id: pause_resume.files_and_memory
  title: Pause and resume preserve files and memory.
  rules:
  - pause_resume/files-and-memory
