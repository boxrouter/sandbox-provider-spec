  - op: process.start
    target: box
    in:
      bash_script: 'python3 -u -c ''from http.server import BaseHTTPRequestHandler, HTTPServer; class_body="def
        do_GET(self):\n self.send_response(200); self.end_headers(); self.wfile.write(b\"sps-preview\")\ndef
