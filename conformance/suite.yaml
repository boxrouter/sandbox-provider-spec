          add="useradd --create-home --uid 10001 --shell /bin/bash runner"
        else
          add="adduser -D -u 10001 -s /bin/sh runner"
        fi
        if [ "$(id -u)" = 0 ]; then
          $add
        else
          sudo -n $add
        fi
    expect:
      equals:
        exit_code: 0
  - op: files.write
    target: box
    in:
      path: /tmp/sps-write-user-file
      data: Y29uZm9ybWFuY2UK
      user: runner
  - op: run
    target: box
    in:
      bash_script: test "$(stat -c '%u' /tmp/sps-write-user-file)" = "$(id -u runner)"
    expect:
      equals:
        exit_code: 0
  - op: run
    target: box
    in:
      bash_script: cat /tmp/sps-write-user-file
    expect:
      equals:
        exit_code: 0
        stdout: {utf8: "conformance\n"}
  rules:
  - user-selection/files-write
  proves: []
- id: process.start.user
  title: A background process starts as the named user.
  steps:
  - op: create
    as: box
  - op: run
    target: box
    in:
      bash_script: |
        if command -v useradd >/dev/null 2>&1; then
          add="useradd --create-home --uid 10001 --shell /bin/bash runner"
        else
          add="adduser -D -u 10001 -s /bin/sh runner"
        fi
        if [ "$(id -u)" = 0 ]; then
          $add
        else
          sudo -n $add
        fi
    expect:
      equals:
        exit_code: 0
  - op: process.start
    target: box
    as: process
    in:
      bash_script: id -un > /tmp/sps-process-user
      run_as: runner
  - op: process.wait
    target: process
    in:
      timeout_ms: 30000
    expect:
      equals:
        exit_code: 0
  - op: run
    target: box
    in:
      bash_script: cat /tmp/sps-process-user
    expect:
      equals:
        exit_code: 0
        stdout: {utf8: "runner\n"}
  rules:
  - user-selection/process-start
  proves: []
- id: run.base64
  title: With output base64 a command's streams come back as exactly the bytes it wrote, bytes that are not UTF-8 included.
  steps:
  - op: create
    as: box
  - op: run
    target: box
    in:
      bash_script: printf '\377\000\376out' ; printf 'er\200\000r' >&2
      output: base64
    expect:
      equals:
        exit_code: 0
        stdout: {b64: /wD+b3V0}
        stderr: {b64: ZXKAAHI=}
  rules:
  - provider-api/run-base64
  proves: []
- id: resume.lifetime
  title: A resume that names the lifetime left arms the timer in the same call, so the sandbox ends that many seconds after the resume and outlives the lifetime it was created with.
  rules:
  - provider-api/resume-lifetime
  proves: []
  steps:
  - op: create
    in:
      lifetime_seconds: 300
      requirements:
        pause_resume: {}
    as: box
  - op: pause
    target: box
  - op: resume.lifetime
    target: box
    in:
      lifetime_seconds: 420
    as: again
    expect:
      equals:
        armed: true
  - wait_ms: 305000
  - op: run
    target: again
    in:
      bash_script: 'true'
    expect:
      equals:
        exit_code: 0
  - op: get
    target: again
    expect:
      equals:
        state:
          one_of:
          - active
          - paused
- id: contract.files_write_missing_parent
  title: A write under a missing parent either creates the parents and the bytes read back, or is not_found and creates nothing.
  steps:
  - op: create
    as: box
  - op: fixture.files_write_missing_parent
    target: box
    expect:
      equals:
        passed: true
      record:
      - stdout
  rules:
  - provider-api/files-write-parents
  proves: []
- id: labels.update
  title: Updating labels sets the given keys, removes the keys given as an empty string, and leaves the others.
  rules:
  - provider-api/labels-update
  proves: []
  steps:
  - op: create
    in:
      labels:
        sps.keep: one
        sps.change: before
        sps.drop: gone
    as: box
  - op: labels.update
    target: box
    in:
      labels:
        sps.change: after
        sps.drop: ''
        sps.add: new
    expect:
      equals:
        labels:
          sps.keep: one
          sps.change: after
          sps.add: new
  - op: get
    target: box
    expect:
      equals:
        labels:
          sps.keep: one
          sps.change: after
          sps.add: new
  - op: list
    in:
      labels:
        sps.change: after
        sps.add: new
    expect:
      equals:
        count: 1
      eventually_ms: 10000
  - op: list
    in:
      labels:
        sps.change: before
    expect:
      equals:
        count: 0
      eventually_ms: 10000
