        read_only: true
      requirements:
        volumes:
          sharing: many_writers
          kind: filesystem
          read_only_mounts: true
    as: readonly
  - op: run
    target: readonly
    in:
      bash_script: if printf x > /sps-volume/readonly-write 2>/dev/null; then printf writable; else printf denied; fi
    expect:
