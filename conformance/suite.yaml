- id: previews.link_lifetime_seconds.public
  title: An issued preview remains usable for the requested bounded lifetime. The link is public.
  rules:
  - previews/link-lifetime
  proves:
  - gate: previews
    knob: link_lifetime_seconds
    value:
      at_least: $runner.link_lifetime_wait_seconds
  steps:
  - op: create
    in:
      lifetime_seconds: $runner.preview_sandbox_lifetime_seconds
      requirements:
        previews:
          access: public
          ports:
          - 3000
    as: box
  - op: process.start
    target: box
    in:
      bash_script: 'python3 -u -c ''from http.server import BaseHTTPRequestHandler, HTTPServer; class_body="def
        do_GET(self):\n self.send_response(200); self.end_headers(); self.wfile.write(b\"sps-preview\")\ndef
        log_message(self,*args): pass"; Handler=type("Handler",(BaseHTTPRequestHandler,),{}); exec(class_body,globals(),ns:={});
        [setattr(Handler,k,v) for k,v in ns.items()]; httpd=HTTPServer(("0.0.0.0",3000),Handler); open("/tmp/sps-ready-3000","w").close();
        httpd.serve_forever()'''
      timeout_ms: $runner.preview_process_timeout_ms
    as: server
  - op: files.exists
    target: box
    in:
      path: /tmp/sps-ready-3000
    expect:
      equals:
        exists: true
      eventually_ms: 5000
  - op: preview.link
    target: box
    in:
      port: 3000
      access: public
      credential: null
      lifetime_seconds: $runner.preview_link_lifetime_seconds
    as: link
  - op: probe.http
    in:
      url: $link.url
      headers: $link.headers
    expect:
      equals:
        served: true
      eventually_ms: 10000
  - wait_ms: $runner.link_lifetime_wait_ms
  - op: probe.http
    in:
      url: $link.url
      headers: $link.headers
    expect:
      equals:
        served: true

