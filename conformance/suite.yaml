- id: edge.previews.public_under_lockdown
  title: Observe public preview reachability with native deny-all egress.
  rules: [previews/public-serves-anyone]
  proves: []
  steps:
  - op: create
    in:
      requirements:
        previews:
          access: public
          ports:
          - 3000
          - 3001
        network_lockdown:
          policy: deny_all
    as: box
  - op: process.start
    target: box
    in:
      bash_script: 'python3 -u -c ''from http.server import BaseHTTPRequestHandler, HTTPServer; class_body="def
        do_GET(self):\n self.send_response(200); self.end_headers(); self.wfile.write(b\"sps-preview\")\ndef
        log_message(self,*args): pass"; Handler=type("Handler",(BaseHTTPRequestHandler,),{}); exec(class_body,globals(),ns:={});
        [setattr(Handler,k,v) for k,v in ns.items()]; httpd=HTTPServer(("0.0.0.0",3000),Handler); open("/tmp/sps-ready-3000","w").close();
        httpd.serve_forever()'''
      timeout_ms: 180000
    as: server
  - op: process.start
    target: box
    in:
      bash_script: 'python3 -u -c ''from http.server import BaseHTTPRequestHandler, HTTPServer; class_body="def
        do_GET(self):\n self.send_response(200); self.end_headers(); self.wfile.write(b\"sps-preview\")\ndef
        log_message(self,*args): pass"; Handler=type("Handler",(BaseHTTPRequestHandler,),{}); exec(class_body,globals(),ns:={});
        [setattr(Handler,k,v) for k,v in ns.items()]; httpd=HTTPServer(("0.0.0.0",3001),Handler); open("/tmp/sps-ready-3001","w").close();
        httpd.serve_forever()'''
      timeout_ms: 180000
    as: other_server
  - op: files.exists
    target: box
    in:
      path: /tmp/sps-ready-3000
    expect:
      equals:
        exists: true
      eventually_ms: 5000
  - op: files.exists
    target: box
    in:
      path: /tmp/sps-ready-3001
    expect:
      equals:
        exists: true
      eventually_ms: 5000
  - op: preview.link
    target: box
    in:
      port: 3000
      access: public
      credential: null
      lifetime_seconds: 60
    as: link
  - op: probe.http
    in:
      url: $link.url
      headers: $link.headers
    expect:
      record:
      - served
