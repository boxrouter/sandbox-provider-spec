  - op: image.delete
    target: image
- id: images.v1.idempotent_prepare
  title: A repeated prepare with one key returns one image, and another request with that key is a conflict.
  rules:
  - provider-api/image-idempotent
  proves: []
  steps:
  - op: image.prepare
    in:
      source: oci
      image: $runner.prepared_oci_image
      idempotency_key: image-same
    as: first
  - op: image.prepare
    in:
      source: oci
      image: $runner.prepared_oci_image
      idempotency_key: image-same
    as: second
  - op: bindings.compare
    in:
      left: $first.identity
      right: $second.identity
    expect:
      equals:
        equal: true
  - op: image.prepare
    in:
      source: oci
      image: $runner.prepared_oci_image
      idempotency_key: image-same
      labels:
        sps.test.case: image-idempotent-other
    expect:
      error: conflict
