- id: hidden_secrets.injected
  title: A generated credential is injected externally and remains absent from guest environment and procfs.
  rules:
  - hidden_secrets/injected
  proves: []
  steps:
  - op: secret.create
    in:
      value: sps-generated-test-secret
    as: secret
  - op: fixture.secret_receiver
    in:
      value: sps-generated-test-secret
    as: receiver
  - op: probe.http
    in:
      url: $receiver.health_url
    expect:
      equals:
        served: true
  - op: create
    in:
      secret: $secret
      requirements:
        hidden_secrets:
          inject_into: $receiver.hosts
    as: box
  - op: run
    target: box
    in:
      bash_script: env; cat /proc/self/environ
    expect:
      equals:
        stdout:
          utf8_absent: sps-generated-test-secret
  - op: run
    target: box
    in:
      bash_script: python3 -c 'import os, urllib.parse, urllib.request; u=os.environ["TARGET"]; urllib.request.build_opener(urllib.request.ProxyHandler()).open(u+("&"
        if "?" in u else "?")+urllib.parse.urlencode({"sps_run":os.environ["SPS_RUN"]}), timeout=5).read(1)'
      environment:
        TARGET: $receiver.url
        SPS_RUN: $runner.run_nonce
