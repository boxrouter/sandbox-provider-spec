# Put a published SPS release wheel on PyPI (Trusted Publishing, no stored token). OFF unless the
# repository variable PYPI_PUBLISH_SANDBOX_PROVIDER_SPEC and the organization switch
# BOXROUTER_PUBLIC_RELEASES are both "enabled". A scheduled run puts the latest release on PyPI
# unless that version is already there; a manual run takes an optional tag and, by default, only
# dry-runs. The uploaded file is the release's own wheel: it must match SHA256SUMS and SOURCE.json,
# carry its release attestation and pass the distribution verifier; nothing is rebuilt here. Rules
# and the switch-on steps: ai/rules/public-registries.md and the provider-api launch runbook.
name: Publish release to PyPI

on:
  schedule:
    - cron: '37 6 * * *'
  workflow_dispatch:
    inputs:
      tag:
        description: Published release tag to put on PyPI (for example v0.3.230); empty means the latest
        required: false
        default: ''
        type: string
      dry_run:
        description: Build and verify the exact wheel and stop before any upload (needs no switch)
        required: false
        default: true
        type: boolean

permissions: {}

concurrency:
  group: publish-pypi
  cancel-in-progress: false

env:
  PYPI_PROJECT: sandbox-provider-spec

jobs:
  gate:
    # Only the public repository publishes; the private source mirror carries this file too.
    if: github.repository == 'boxrouter/sandbox-provider-spec'
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.switch.outputs.run }}
    steps:
      - name: The run comes from main and publishing is switched on
        id: switch
        env:
          REPO_SWITCH: ${{ vars.PYPI_PUBLISH_SANDBOX_PROVIDER_SPEC }}
          ORG_SWITCH: ${{ vars.BOXROUTER_PUBLIC_RELEASES }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
          EVENT: ${{ github.event_name }}
        run: |
          test "$GITHUB_REF" = refs/heads/main || { echo 'Run this workflow from main' >&2; exit 1; }
          if [ "$DRY_RUN" = true ]; then
            echo 'Dry run: nothing is uploaded, so no switch is needed'
            echo 'run=true' >> "$GITHUB_OUTPUT"
          elif [ "$REPO_SWITCH" = enabled ] && [ "$ORG_SWITCH" = enabled ]; then
            echo 'run=true' >> "$GITHUB_OUTPUT"
          elif [ "$EVENT" = schedule ]; then
            echo 'PyPI publishing is switched off; nothing to do' >> "$GITHUB_STEP_SUMMARY"
            echo 'run=false' >> "$GITHUB_OUTPUT"
          else
            echo 'PyPI publishing is switched off (repository variable PYPI_PUBLISH_SANDBOX_PROVIDER_SPEC and organization variable BOXROUTER_PUBLIC_RELEASES must both be "enabled")' >&2
            exit 1
          fi

  resolve:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.pick.outputs.tag }}
      version: ${{ steps.pick.outputs.version }}
      skip: ${{ steps.pick.outputs.skip }}
    steps:
      - name: Pick the release and skip it if PyPI already has it
        id: pick
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED: ${{ inputs.tag }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: |
          set -euo pipefail
          tag="$REQUESTED"
          if [ -z "$tag" ]; then
            tag=$(gh release list -R "$GITHUB_REPOSITORY" --exclude-pre-releases --exclude-drafts --limit 1 --json tagName --jq '.[0].tagName')
          fi
          test -n "$tag" || { echo 'No published release found' >&2; exit 1; }
          [[ "$tag" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || {
            echo "Release tag $tag is not a stable vX.Y.Z tag" >&2; exit 1; }
          state=$(gh release view "$tag" -R "$GITHUB_REPOSITORY" --json isDraft,isPrerelease --jq '[.isDraft,.isPrerelease]|join(",")')
          test "$state" = false,false || { echo "Release $tag is a draft or prerelease" >&2; exit 1; }
          version="${tag#v}"
          skip=false
          if [ "$DRY_RUN" != true ] && curl -fsS -o /dev/null "https://pypi.org/pypi/${PYPI_PROJECT}/${version}/json" > /dev/null 2>&1; then
            skip=true
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "skip=$skip" >> "$GITHUB_OUTPUT"
          echo "Release $tag; already on PyPI: $skip"

  candidate:
    # Verifies the release's own wheel. It holds no OIDC token and cannot publish.
    needs: resolve
    if: needs.resolve.outputs.skip != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      attestations: read
    outputs:
      sha256: ${{ steps.verify.outputs.sha256 }}
    steps:
      - name: Check out the release tag
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: refs/tags/${{ needs.resolve.outputs.tag }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          version: '0.13.4'
          python-version: '3.11'
          enable-cache: false
      - name: Download the release assets and check them against each other
        id: verify
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.resolve.outputs.tag }}
          VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          set -euo pipefail
          mkdir release-assets dist
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir release-assets
          wheel="sandbox_provider_spec-${VERSION}-py3-none-any.whl"
          test "$(ls release-assets | LC_ALL=C sort | tr '\n' ' ')" = "SHA256SUMS SOURCE.json $wheel " || {
            echo "Unexpected release assets: $(ls release-assets)" >&2; exit 1; }
          (cd release-assets && sha256sum --check --strict SHA256SUMS)
          test "$(cut -d' ' -f3 release-assets/SHA256SUMS | LC_ALL=C sort | tr '\n' ' ')" = "SOURCE.json $wheel " || {
            echo 'SHA256SUMS must cover exactly the wheel and SOURCE.json' >&2; exit 1; }
          digest=$(sha256sum "release-assets/$wheel" | cut -d' ' -f1)
          commit=$(git rev-parse "refs/tags/${TAG}^{commit}")
          python3 - "$wheel" "$digest" "$commit" <<'PY'
          import json, os, sys
          wheel, digest, commit = sys.argv[1:]
          source = json.load(open("release-assets/SOURCE.json", encoding="utf-8"))
          expected = {
              "repository": os.environ["GITHUB_REPOSITORY"],
              "tag": os.environ["TAG"],
              "source_commit": commit,
              "version": os.environ["VERSION"],
              "asset": wheel,
              "asset_sha256": digest,
          }
          if source != expected:
              sys.exit(f"SOURCE.json does not bind this tag and wheel: {source} != {expected}")
          PY
          cp "release-assets/$wheel" dist/
          echo "sha256=$digest" >> "$GITHUB_OUTPUT"
      - name: Verify the release attestation
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.resolve.outputs.tag }}
        run: >-
          gh attestation verify dist/*.whl
          --repo "$GITHUB_REPOSITORY"
          --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml"
          --source-ref "refs/tags/$TAG"
      - name: Verify the wheel against the distribution manifest
        env:
          TAG: ${{ needs.resolve.outputs.tag }}
        run: >-
          python3 scripts/verify_distribution.py
          --manifest distribution-manifest.json
          --artifact-directory dist
          --tag "$TAG"
      - name: Check the package page renders and the upload is acceptable
        run: |
          uvx --from twine==7.0.0 twine check --strict dist/*.whl
          uv publish --dry-run --check-url "https://pypi.org/simple/${PYPI_PROJECT}/" dist/*.whl
      - name: Keep the verified wheel for the publish job
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: pypi-dist
          path: dist/
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: [resolve, candidate]
    if: needs.resolve.outputs.skip != 'true' && !(github.event_name == 'workflow_dispatch' && inputs.dry_run)
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/sandbox-provider-spec/
    permissions:
      id-token: write
    steps:
      - name: Fetch the verified wheel
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: pypi-dist
          path: dist/
      - name: The wheel is the one that was verified
        env:
          EXPECTED: ${{ needs.candidate.outputs.sha256 }}
        run: |
          set -euo pipefail
          test "$(ls dist | wc -l)" -eq 1
          printf '%s  %s\n' "$EXPECTED" dist/*.whl | sha256sum --check --strict
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: dist/

  check:
    # Layer 4: the registry serves exactly the file that was verified.
    needs: [resolve, candidate, publish]
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          version: '0.13.4'
          python-version: '3.11'
          enable-cache: false
      - name: Download from PyPI and compare with the verified wheel
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
          EXPECTED: ${{ needs.candidate.outputs.sha256 }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            rm -rf served && mkdir served
            if uvx pip download --no-deps --no-cache-dir --dest served "${PYPI_PROJECT}==${VERSION}"; then
              break
            fi
            test "$attempt" -lt 30 || { echo "PyPI does not serve ${PYPI_PROJECT}==${VERSION}" >&2; exit 1; }
            sleep 30
          done
          printf '%s  %s\n' "$EXPECTED" served/*.whl | sha256sum --check --strict
          uv tool run --no-cache --from "${PYPI_PROJECT}==${VERSION}" sandbox-provider-spec check-catalog
      - name: How to withdraw
        if: failure()
        run: |
          echo "A published release failed its post-publish check. Withdraw it and fix forward: ai/rules/public-registries.md, 'Withdraw a release'." >> "$GITHUB_STEP_SUMMARY"
