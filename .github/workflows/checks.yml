# Exported to the standalone public package mirror.
name: Checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  # At most one run per ref waits; a newer pending run replaces it and running jobs finish.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  check:
    runs-on: ${{ vars.CI_RUNNER_BACKFILL || vars.CI_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          version: '0.13.4'
          python-version: '3.11'
      - name: Check specification
        run: make check
