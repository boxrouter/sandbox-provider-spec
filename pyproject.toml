[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[project]
name = "sandbox-provider-spec"
version = "0.3.192"
description = "The Sandbox Provider Specification: what a sandbox provider guarantees, how it declares it, and how conformance proves it"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.11"
classifiers = [
    "Programming Language :: Python :: 3",
    "Typing :: Typed",
]
dependencies = [
    "jsonschema>=4.23,<5",
    "pyyaml>=6.0.1,<7",
]

[project.scripts]
sandbox-provider-spec = "sandbox_provider_spec.cli:main"

[project.optional-dependencies]
docker = ["docker==7.2.0"]
e2b = [
    "e2b==2.59.0",
    "e2b-code-interpreter==2.11.3",
    "e2b-desktop==2.6.0",
]
modal = ["modal==1.6.1"]
daytona = ["daytona==0.226.1"]
vercel = ["vercel-sandbox==0.9.0"]
blaxel = ["blaxel==0.4.8"]
browser = [
    "playwright==1.63.0",
]

[dependency-groups]
dev = [
    "mypy==1.15.0",
    "pylint==4.0.8",
    "pyright==1.1.398",
    "pytest==9.1.1",
    "pytest-xdist[psutil]==3.8.0",
    "ruff==0.16.6",
    "types-jsonschema==4.26.0.20260518",
    "types-protobuf==7.35.1.20260906",
    "types-pyyaml==6.0.12.20260906",
]
docs = [
    "markdown-it-py==4.2.0",
    "pymarkdownlnt==0.9.41",
]

[tool.hatch.build.targets.wheel]
packages = ["src/sandbox_provider_spec"]
exclude = ["src/sandbox_provider_spec/data/**"]

[tool.hatch.build.targets.wheel.force-include]
"conformance" = "sandbox_provider_spec/data/conformance"
"docs" = "sandbox_provider_spec/data/docs"
"spec" = "sandbox_provider_spec/data"
"providers" = "sandbox_provider_spec/data/providers"

[tool.pytest.ini_options]
testpaths = ["tests"]
# Module diagnostic matrices launch real subprocesses. Keep each file on one worker
# so parametrized rows reuse that matrix instead of rebuilding it in every worker.
# Bound concurrent process-heavy files so timing diagnostics do not compete eight ways.
addopts = "-ra -n 2 --dist loadfile"
markers = [
    "rule(rule_id): specification rule checked by this test",
    "loopback: test starts a loopback server",
    "integration: test exercises a local protocol end to end",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "TID251", "TID252", "PLC0415"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"sys.path".msg = "Install packages instead of changing import paths."
"unittest".msg = "Use pytest."

[tool.mypy]
python_version = "3.11"
follow_imports_for_stubs = true  # lets the numpy override below skip its stub
strict = true
files = ["src", "tests", "tools"]

[[tool.mypy.overrides]]
# The workspace environment holds the benchmark runner's numpy 2.5, whose stub uses the Python 3.12 `type`
# statement: with python_version 3.11 mypy aborts parsing it. No package here uses numpy, so skip it.
module = ["numpy", "numpy.*"]
follow_imports = "skip"

[tool.pyright]
include = ["src", "tests", "tools"]
venvPath = "."
venv = ".venv"
pythonVersion = "3.11"
typeCheckingMode = "basic"

[tool.pylint.main]
py-version = "3.11"

[tool.pylint.format]
max-line-length = 100

[tool.pylint.messages_control]
disable = [
    "missing-class-docstring", "missing-function-docstring", "missing-module-docstring",
    "too-few-public-methods", "wrong-import-order", "line-too-long",
    # The checker's functions are flat lists of the spec's rules, in the spec's order;
    # splitting them to meet a count would scatter one rule set across helpers.
    "too-many-branches", "too-many-return-statements", "too-many-locals", "too-many-statements",
    # The strict YAML loader subclasses PyYAML's SafeLoader, which has eight bases.
    "too-many-ancestors",
]
